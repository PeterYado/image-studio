<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Image Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5FA; --surface:#FFFFFF; --canvas-bg:#211B29; --ink:#1A1320; --ink-soft:#6B6478;
    --line:#E7E2EE; --accent:#6B3FA0; --accent-deep:#4A2873; --accent-wash:#F0EBF7;
    --radius:14px; --shadow:0 1px 2px rgba(26,19,32,.04),0 8px 24px rgba(74,40,115,.06);
    --font:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;user-select:none;}

  header{flex:none;padding:max(14px,env(safe-area-inset-top)) 20px 0;display:flex;flex-direction:column;gap:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative;flex:none;}
  .brand-mark::before{content:"";position:absolute;inset:6px 6px auto auto;width:8px;height:8px;background:var(--bg);border-radius:2px;box-shadow:-10px 0 0 var(--bg),0 10px 0 var(--bg),-10px 10px 0 rgba(247,245,250,.55);}
  .brand h1{font-size:17px;font-weight:900;letter-spacing:.04em;}
  .brand h1 span{color:var(--accent);}

  .tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line);width:fit-content;}
  .tab{appearance:none;border:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:700;color:var(--ink-soft);background:transparent;padding:9px 22px;border-radius:9px;transition:color .18s,background .18s;letter-spacing:.02em;}
  .tab.active{color:#fff;background:var(--accent);}

  /* tool panel */
  .toolpanel{flex:none;margin:14px 20px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:none;flex-wrap:wrap;align-items:center;gap:10px 18px;}
  .toolpanel.show{display:flex;}
  .group{display:flex;align-items:center;gap:8px;}
  .group-label{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
  .seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .seg button{appearance:none;border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;color:var(--ink-soft);background:transparent;padding:7px 13px;border-radius:7px;transition:color .15s,background .15s;}
  .seg button.on{color:#fff;background:var(--accent);}
  .ctl{display:flex;align-items:center;gap:10px;flex:1;min-width:160px;}
  .ctl > label{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .ctl .val{font-size:12px;font-weight:700;color:var(--accent-deep);min-width:26px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:70px;height:4px;border-radius:99px;background:var(--line);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(74,40,115,.4);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 1px 4px rgba(74,40,115,.4);cursor:pointer;}
  .panel-actions{display:flex;gap:8px;}

  /* emoji sticker panel */
  .emoji-panel{display:none;align-items:center;gap:10px;}
  .emoji-panel.show{display:flex;}
  .stamp-trigger{appearance:none;border:1px solid var(--line);background:var(--bg);cursor:pointer;width:42px;height:42px;border-radius:10px;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s,background .15s;}
  .stamp-trigger:hover{background:var(--accent-wash);}
  .stamp-trigger:active{transform:scale(.92);}

  /* emoji picker (popover on desktop, bottom sheet on mobile) */
  .emoji-picker-backdrop{position:fixed;inset:0;z-index:40;display:none;}
  .emoji-picker-backdrop.show{display:block;}
  .emoji-picker{position:fixed;z-index:41;display:none;flex-direction:column;width:368px;max-height:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(26,19,32,.25);overflow:hidden;}
  .emoji-picker.show{display:flex;}
  .emoji-cats{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;}
  .emoji-cats button{appearance:none;border:none;background:transparent;font-size:20px;width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none;line-height:1;}
  .emoji-cats button.on{background:var(--accent-wash);}
  .emoji-scroll{overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;min-height:80px;}
  .emoji-scroll button{appearance:none;border:none;background:transparent;font-size:24px;width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .emoji-scroll button:hover{background:var(--accent-wash);}
  .emoji-scroll .empty{grid-column:1/-1;color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 8px;}
  @media(max-width:640px){
    .emoji-picker{left:0!important;right:0!important;bottom:0!important;top:auto!important;width:auto;max-height:48vh;border-radius:16px 16px 0 0;border-bottom:none;}
    .emoji-scroll{grid-template-columns:repeat(6,1fr);}
  }

  /* color picker for box fill */
  .color-trigger{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;background:#000;transition:transform .1s;}
  .color-trigger:active{transform:scale(.92);}
  .color-picker-backdrop{position:fixed;inset:0;z-index:40;display:none;}
  .color-picker-backdrop.show{display:block;}
  .color-picker{position:fixed;z-index:41;display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(26,19,32,.25);padding:12px;grid-template-columns:repeat(10,1fr);gap:7px;}
  .color-picker.show{display:grid;}
  .color-picker button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;}
  .color-picker button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);}
  .color-picker button .chk{font-size:13px;font-weight:700;}
  @media(max-width:640px){
    .color-picker{left:0!important;right:0!important;bottom:0!important;top:auto!important;border-radius:16px 16px 0 0;justify-content:center;}
  }

  /* upscale panel */
  .uppanel{flex:none;margin:14px 20px 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:none;align-items:center;gap:14px;flex-wrap:wrap;}
  .uppanel.show{display:flex;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;}
  .badge.gpu{background:#E7F8EE;color:#1B7A43;}
  .badge.cpu{background:#FFF4E0;color:#9A6700;}
  .badge.none{background:#FCE8E8;color:#B42318;}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .up-actions{margin-left:auto;display:flex;gap:8px;}

  /* progress overlay */
  .progress{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(26,19,32,.6);backdrop-filter:blur(4px);padding:32px;text-align:center;}
  .progress.show{display:flex;}
  .progress .ptext{color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em;}
  .progress .pbar{width:min(280px,70%);height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;}
  .progress .pfill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s;}
  .progress .psub{color:rgba(255,255,255,.65);font-size:12px;line-height:1.5;max-width:320px;}

  @media (max-width:640px){
    .uppanel{gap:10px;}
    .up-actions{margin-left:0;flex:1;}
    .up-actions .btn{flex:1;justify-content:center;}
  }

  main{flex:1;min-height:0;padding:14px 20px;display:flex;}
  .stage{flex:1;border-radius:var(--radius);background:var(--canvas-bg);position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.025) 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;pointer-events:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;touch-action:none;}
  canvas.loaded{display:block;}

  .zoomctl{position:absolute;right:12px;bottom:12px;z-index:4;display:none;gap:6px;padding:5px;background:rgba(26,19,32,.55);backdrop-filter:blur(8px);border-radius:12px;}
  .zoomctl.show{display:flex;}
  .zoomctl button{appearance:none;border:none;cursor:pointer;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .zoomctl button:hover{background:rgba(255,255,255,.18);}
  .zoomctl button:active{transform:scale(.94);}
  .zoomctl button svg{width:18px;height:18px;}
  .zoomlabel{position:absolute;left:12px;bottom:14px;z-index:4;display:none;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(26,19,32,.5);padding:6px 11px;border-radius:9px;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;}
  .zoomlabel.show{display:block;}

  .drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;z-index:5;transition:background .18s;}
  .drop.hide{display:none;}
  .drop.over{background:rgba(107,63,160,.16);}
  .drop-ico{width:56px;height:56px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;}
  .drop-ico svg{width:26px;height:26px;stroke:rgba(255,255,255,.7);}
  .drop p{color:rgba(255,255,255,.78);font-size:14px;font-weight:500;line-height:1.5;}
  .drop p b{color:#fff;font-weight:700;}
  .drop .pick{margin-top:4px;appearance:none;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:14px;color:var(--accent-deep);background:#fff;padding:11px 24px;border-radius:10px;transition:transform .12s;}
  .drop .pick:active{transform:scale(.96);}

  .toolbar{flex:none;padding:10px 20px max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;}
  .tool-hint{flex:1;font-size:12.5px;color:var(--ink-soft);font-weight:500;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tool-hint b{color:var(--accent-deep);}
  .btn{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:14px;padding:11px 20px;border-radius:11px;transition:transform .12s,opacity .18s,background .18s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .btn:active{transform:scale(.96);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn svg{width:16px;height:16px;}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
  .btn-primary{background:var(--accent);border:1px solid var(--accent);color:#fff;}
  .btn-sm{padding:9px 14px;font-size:13px;}

  .wip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.6);background:rgba(0,0,0,.25);padding:6px 14px;border-radius:99px;backdrop-filter:blur(6px);display:none;}
  .wip.show{display:block;}

  @media (max-width:640px){
    .brand h1{font-size:16px;}
    .tab{padding:9px 0;flex:1;text-align:center;}
    .tabs{width:100%;}
    .toolpanel{gap:10px 12px;}
    .ctl{flex-basis:100%;min-width:0;}
    .panel-actions{flex:1;}
    .panel-actions .btn{flex:1;justify-content:center;}
    .btn{padding:11px 16px;}
    .tool-hint{display:none;}
    .toolbar{gap:8px;}
    .toolbar .btn{flex:1;justify-content:center;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-mark"></div><h1>IMAGE <span>STUDIO</span></h1></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="mosaic" role="tab">モザイク</button>
      <button class="tab" data-tab="upscale" role="tab">画質アップ</button>
      <button class="tab" data-tab="convert" role="tab">形式変換</button>
    </div>
  </header>

  <div class="toolpanel" id="toolpanel">
    <div class="group">
      <span class="group-label">種類</span>
      <div class="seg" id="effectSeg">
        <button data-effect="pixelate" class="on">ピクセル</button>
        <button data-effect="blur">ぼかし</button>
        <button data-effect="box">ベタ塗り</button>
        <button data-effect="sticker">スタンプ</button>
      </div>
    </div>
    <div class="group" id="modeGroup">
      <span class="group-label">方式</span>
      <div class="seg" id="modeSeg">
        <button data-mode="rect" class="on">四角</button>
        <button data-mode="brush">ブラシ</button>
      </div>
    </div>
    <div class="ctl" id="strengthCtl">
      <label id="strengthLabel">粗さ</label>
      <input type="range" id="strength" min="6" max="80" value="22" step="1">
      <span class="val" id="strengthVal">22</span>
    </div>
    <div class="ctl" id="colorCtl" style="display:none;">
      <label>塗り</label>
      <button type="button" class="color-trigger" id="colorTrigger"></button>
    </div>
    <div class="ctl" id="brushCtl" style="display:none;">
      <label>太さ</label>
      <input type="range" id="brushSize" min="10" max="200" value="60" step="2">
      <span class="val" id="brushSizeVal">60</span>
    </div>
    <div class="emoji-panel" id="emojiPanel">
      <span class="group-label">スタンプ</span>
      <button type="button" class="stamp-trigger" id="stampTrigger">🙂</button>
    </div>
    <div class="panel-actions">
      <button class="btn btn-ghost btn-sm" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
        元に戻す
      </button>
      <button class="btn btn-ghost btn-sm" id="clearBtn" disabled>すべて消去</button>
    </div>
  </div>

  <div class="uppanel" id="uppanel">
    <div class="group">
      <span class="group-label">モデル</span>
      <div class="seg" id="modelSeg">
        <button data-model="photo" class="on">写真</button>
        <button data-model="illust">イラスト</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">倍率</span>
      <div class="seg" id="scaleSeg">
        <button data-scale="1.5">1.5×</button>
        <button data-scale="2" class="on">2×</button>
        <button data-scale="4">4×</button>
      </div>
    </div>
    <span class="badge none" id="accelBadge"><span class="dot"></span><span id="accelText">確認中…</span></span>
    <div class="up-actions">
      <button class="btn btn-primary btn-sm" id="upscaleBtn">画質を上げる</button>
    </div>
  </div>

  <div class="uppanel" id="convpanel">
    <div class="group">
      <span class="group-label">形式</span>
      <div class="seg" id="formatSeg">
        <button data-fmt="jpg" class="on">JPG</button>
        <button data-fmt="png">PNG</button>
        <button data-fmt="svg">SVG</button>
      </div>
    </div>
    <div class="ctl" id="qualityCtl">
      <label>画質</label>
      <input type="range" id="quality" min="50" max="100" value="92" step="1">
      <span class="val" id="qualityVal">92</span>
    </div>
    <div class="up-actions">
      <button class="btn btn-primary btn-sm" id="convertBtn">変換して保存</button>
    </div>
  </div>

  <main>
    <div class="stage" id="stage">
      <div class="wip" id="wip">この機能は次のステップで実装予定</div>
      <div class="progress" id="progress">
        <div class="ptext" id="progressText">準備中…</div>
        <div class="pbar"><div class="pfill" id="progressFill"></div></div>
        <div class="psub" id="progressSub"></div>
      </div>
      <canvas id="canvas"></canvas>
      <div class="zoomlabel" id="zoomlabel">100%</div>
      <div class="zoomctl" id="zoomctl">
        <button id="zoomOut" title="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button id="zoomFit" title="全体表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/></svg></button>
        <button id="zoomIn" title="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
      </div>
      <div class="drop" id="drop">
        <div class="drop-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
        <p>写真を<b>ドラッグ＆ドロップ</b><br>または下のボタンから選択</p>
        <button class="pick" id="pickEmpty">写真を選ぶ</button>
      </div>
    </div>
  </main>

  <div class="toolbar">
    <div class="tool-hint" id="hint">写真を読み込んでください</div>
    <button class="btn btn-ghost" id="replaceBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      別の写真
    </button>
    <button class="btn btn-primary" id="saveBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      保存
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>

  <div class="emoji-picker-backdrop" id="pickerBackdrop"></div>
  <div class="emoji-picker" id="emojiPicker">
    <div class="emoji-cats" id="emojiCats"></div>
    <div class="emoji-scroll" id="emojiScroll"></div>
  </div>

  <div class="color-picker-backdrop" id="colorBackdrop"></div>
  <div class="color-picker" id="colorPicker"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const stage=$('stage'), canvas=$('canvas'), ctx=canvas.getContext('2d');
  const drop=$('drop'), wip=$('wip'), hint=$('hint');
  const fileInput=$('fileInput'), saveBtn=$('saveBtn'), replaceBtn=$('replaceBtn'), pickEmpty=$('pickEmpty');
  const tabs=document.querySelectorAll('.tab');
  const toolpanel=$('toolpanel'), effectSeg=$('effectSeg'), modeSeg=$('modeSeg');
  const modeGroup=$('modeGroup'), strengthCtl=$('strengthCtl'), colorCtl=$('colorCtl'), emojiPanel=$('emojiPanel');
  const strength=$('strength'), strengthVal=$('strengthVal'), strengthLabel=$('strengthLabel');
  const brushCtl=$('brushCtl'), brushSize=$('brushSize'), brushSizeVal=$('brushSizeVal');
  const undoBtn=$('undoBtn'), clearBtn=$('clearBtn'), zoomctl=$('zoomctl'), zoomlabel=$('zoomlabel');
  const uppanel=$('uppanel'), scaleSeg=$('scaleSeg'), modelSeg=$('modelSeg'), accelBadge=$('accelBadge'), accelText=$('accelText'), upscaleBtn=$('upscaleBtn');
  const progress=$('progress'), progressText=$('progressText'), progressFill=$('progressFill'), progressSub=$('progressSub');
  const convpanel=$('convpanel'), formatSeg=$('formatSeg'), qualityCtl=$('qualityCtl'), quality=$('quality'), qualityVal=$('qualityVal'), convertBtn=$('convertBtn');

  /* ---------- effect application ---------- */
  function applyOp(op){

  // Build a processed (pixelated/blurred/box) full-frame layer from current comp, then

      const tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th;
      const tctx=tmp.getContext('2d'); tctx.imageSmoothingEnabled=false;
      tctx.drawImage(comp,0,0,comp.width,comp.height,0,0,tw,th);
      lctx.imageSmoothingEnabled=false;

      step(targetW,targetH);

      lctx.fillRect(0,0,comp.width,comp.height);
    }

  }

  function applyRectEffect(r, effectType, strength, color){
    let {x,y,w,h}=r;

    w=Math.min(comp.width-x,Math.round(w)); h=Math.min(comp.height-y,Math.round(h));

    cctx.save(); cctx.beginPath(); cctx.rect(x,y,w,h); cctx.clip();

  function applyPathEffect(path, thickness, effectType, strength, color){

  }

  // Paint `layer` only where a thick polyline mask is drawn.

  strength.addEventListener('input',()=>strengthVal.textContent=strength.value);
  brushSize.addEventListener('input',()=>brushSizeVal.textContent=brushSize.value);

  /* ---------- sticker tool ---------- */
  const stampTrigger=$('stampTrigger'), pickerBackdrop=$('pickerBackdrop'), emojiPicker=$('emojiPicker'), emojiCats=$('emojiCats'), emojiScroll=$('emojiScroll');
  const erange=(a,b)=>{ const o=[]; for(let c=a;c<=b;c++) o.push(String.fromCodePoint(c)); return o; };

  /* ---------- color palette (ベタ塗り) ---------- */
  const colorTrigger=$('colorTrigger'), colorBackdrop=$('colorBackdrop'), colorPicker=$('colorPicker');
  function hsl2hex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l); const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));

  }
  function closeColorPicker(){ colorBackdrop.classList.remove('show'); colorPicker.classList.remove('show'); }
  colorTrigger.style.background=fillColor;
  colorTrigger.addEventListener('click',()=>{ if(hasImage) openColorPicker(); });
  colorBackdrop.addEventListener('click',closeColorPicker);

  function syncToolUI(){
    const st=effect==='sticker', bx=effect==='box';
    modeGroup.style.display=st?'none':'';
    strengthCtl.style.display=(st||bx)?'none':'';
    colorCtl.style.display=bx?'flex':'none';
    brushCtl.style.display=(!st&&mode==='brush')?'flex':'none';
    emojiPanel.classList.toggle('show',st);
    if(!st){ selStickerIdx=-1; closePicker(); }
    if(!bx) closeColorPicker();
    render();
  }
  function addSticker(emoji){
    const size=Math.round(Math.min(base.width,base.height)*0.22);
    operations.push({type:'sticker',emoji,cx:base.width/2,cy:base.height/2,size,angle:0});
    redoStack=[]; selStickerIdx=operations.length-1;
    buildComposite(); render(); updateEditState();
  }
  function stickerHalf(op){ return op.size*0.55; }
  function imgToCanvas(p){ return {x:p.x*scale+ox, y:p.y*scale+oy}; }
  function stickerHandles(op){
    const h=stickerHalf(op), rot=op.angle||0, cos=Math.cos(rot), sin=Math.sin(rot);
    const L=(lx,ly)=>({x:op.cx+lx*cos-ly*sin, y:op.cy+lx*sin+ly*cos});
    return { half:h, resize:L(h,h), rotate:L(0,-(h+26*dpr/scale)), topMid:L(0,-h),
             corners:[L(-h,-h),L(h,-h),L(h,h),L(-h,h)] };
  }
  function pointInSticker(p,op){
    const rot=-(op.angle||0), cos=Math.cos(rot), sin=Math.sin(rot);
    const dx=p.x-op.cx, dy=p.y-op.cy, lx=dx*cos-dy*sin, ly=dx*sin+dy*cos, h=stickerHalf(op);
    return Math.abs(lx)<=h && Math.abs(ly)<=h;
  }
  function hitSticker(pImg,pCanvas){
    const rPix=16*dpr;
    if(selStickerIdx>=0 && operations[selStickerIdx]){
      const H=stickerHandles(operations[selStickerIdx]);
      const dr=imgToCanvas(H.rotate), dz=imgToCanvas(H.resize);
      if(Math.hypot(pCanvas.x-dr.x,pCanvas.y-dr.y)<rPix) return {mode:'rotate',idx:selStickerIdx};
      if(Math.hypot(pCanvas.x-dz.x,pCanvas.y-dz.y)<rPix) return {mode:'resize',idx:selStickerIdx};
    }
    for(let i=operations.length-1;i>=0;i--){ if(operations[i].type==='sticker' && pointInSticker(pImg,operations[i])) return {mode:'move',idx:i}; }
    return null;
  }

  /* ---------- undo / redo / clear ---------- */
  function undo(){ if(operations.length){ redoStack.push(operations.pop()); if(selStickerIdx>=operations.length) selStickerIdx=-1; buildComposite(); render(); updateEditState(); } }
  function redo(){ if(redoStack.length){ operations.push(redoStack.pop()); buildComposite(); render(); updateEditState(); } }
  undoBtn.addEventListener('click',undo);
  clearBtn.addEventListener('click',()=>{ if(operations.length){ redoStack=[]; operations=[]; selStickerIdx=-1; buildComposite(); render(); updateEditState(); } });
  function updateEditState(){ const on=canEdit()&&operations.length>0; undoBtn.disabled=!on; clearBtn.disabled=!on; }

  /* ---------- tabs ---------- */
  tabs.forEach(t=>t.addEventListener('click',()=>{ tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active'); currentTab=t.dataset.tab; refreshUI(); }));
  let accelChecked=false;
  function refreshUI(){
    const m=currentTab==='mosaic', up=currentTab==='upscale', cv=currentTab==='convert';
    toolpanel.classList.toggle('show',hasImage&&m);
    uppanel.classList.toggle('show',hasImage&&up);
    convpanel.classList.toggle('show',hasImage&&cv);
    wip.classList.remove('show');
    zoomctl.classList.toggle('show',hasImage);
    zoomlabel.classList.toggle('show',hasImage);
    if(!hasImage) hint.textContent='写真を読み込んでください';
    else if(m) hint.innerHTML='ドラッグで範囲指定／ホイール・ピンチで拡大、中ボタン・スペースで移動';
    else if(up) hint.innerHTML='倍率を選んで「画質を上げる」（移動・拡大も可能）';
    else hint.innerHTML='形式を選んで「変換して保存」（現在の画像をそのまま変換します）';
    setCursor(); updateEditState();
    if(hasImage&&up&&!accelChecked){ accelChecked=true; detectAccel().then(setAccelBadge); }
  }

  /* ---------- load ---------- */
  function loadFile(file){
    if(!file||!file.type.startsWith('image/')) return;
    sourceName=(file.name||'image').replace(/\.[^.]+$/,'');
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      base.width=img.naturalWidth; base.height=img.naturalHeight;
      comp.width=img.naturalWidth; comp.height=img.naturalHeight;
      bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0,0,base.width,base.height); bctx.drawImage(img,0,0);
      operations=[]; redoStack=[]; selStickerIdx=-1; URL.revokeObjectURL(url);
      hasImage=true; canvas.classList.add('loaded'); drop.classList.add('hide');
      saveBtn.disabled=false; replaceBtn.disabled=false;
      resize(); buildComposite(); fitView(); refreshUI();
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); alert('画像の読み込みに失敗しました'); };
    img.src=url;
  }
  function openPicker(){ fileInput.value=''; fileInput.click(); }
  pickEmpty.addEventListener('click',openPicker);
  replaceBtn.addEventListener('click',openPicker);
  fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));

  ['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault(); if(!hasImage) drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove('over');}));
  stage.addEventListener('drop',e=>{ if(!hasImage){ const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) loadFile(f);} });
  window.addEventListener('paste',e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if(it) loadFile(it.getAsFile()); });

  /* ---------- save ---------- */
  // Only route to the native share sheet on mobile (where it offers "save to Photos").
  // Desktop browsers now support Web Share too, but there a direct download is expected.
  const useShareSheet=(file)=> window.matchMedia('(max-width:640px)').matches && navigator.canShare && navigator.canShare({files:[file]});
  async function doSave(){
    if(!hasImage) return;
    const blob=await new Promise(res=>comp.toBlob(res,'image/png')); if(!blob) return;
    const fname=`${sourceName}_edited.png`, file=new File([blob],fname,{type:'image/png'});
    if(useShareSheet(file)){
      try{ await navigator.share({files:[file]}); return; }catch(err){ if(err&&err.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  saveBtn.addEventListener('click',doSave);

  /* ---------- format convert ---------- */
  formatSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    formatSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    outFormat=b.dataset.fmt;
    qualityCtl.style.display = outFormat==='jpg' ? 'flex' : 'none';
  }));
  quality.addEventListener('input',()=>qualityVal.textContent=quality.value);

  async function doConvert(){
    if(!hasImage) return;
    let blob, fname, mime;
    if(outFormat==='svg'){
      // SVG wrapper: embeds the image as-is (still pixel data, but a valid .svg file)
      const dataUrl=comp.toDataURL('image/png');
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${comp.width}" height="${comp.height}" viewBox="0 0 ${comp.width} ${comp.height}">`
        +`<image width="${comp.width}" height="${comp.height}" xlink:href="${dataUrl}"/></svg>`;
      mime='image/svg+xml';
      blob=new Blob([svg],{type:mime});
      fname=`${sourceName}.svg`;
    }else{
      let out=comp;
      // JPG has no alpha: flatten onto white so transparent areas don't turn black
      if(outFormat==='jpg'){
        const flat=document.createElement('canvas'); flat.width=comp.width; flat.height=comp.height;
        const fx=flat.getContext('2d'); fx.fillStyle='#fff'; fx.fillRect(0,0,flat.width,flat.height); fx.drawImage(comp,0,0);
        out=flat;
      }
      mime = outFormat==='jpg' ? 'image/jpeg' : 'image/png';
      const q = outFormat==='jpg' ? parseInt(quality.value,10)/100 : undefined;
      blob=await new Promise(res=>out.toBlob(res,mime,q)); if(!blob) return;
      fname=`${sourceName}.${outFormat==='jpg'?'jpg':'png'}`;
    }
    const file=new File([blob],fname,{type:mime});
    if(useShareSheet(file)){
      try{ await navigator.share({files:[file]}); return; }catch(err){ if(err&&err.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  convertBtn.addEventListener('click',doConvert);

  /* ---------- upscale: accel detection ---------- */
  // Prefer the discrete GPU on multi-GPU PCs, then fall back to any adapter.
  async function requestGpuAdapter(){
    if(!navigator.gpu) return null;
    for(const powerPreference of ['high-performance',undefined,'low-power']){
      try{ const a=await navigator.gpu.requestAdapter(powerPreference?{powerPreference}:undefined); if(a) return a; }catch{}
    }
    return null;
  }
  async function detectAccel(){ return (await requestGpuAdapter()) ? 'webgpu' : 'cpu'; }
  function setAccelBadge(tier){
    accelTier=tier; accelBadge.classList.remove('gpu','cpu','none');
    if(tier==='webgpu'){ accelBadge.classList.add('gpu'); accelText.textContent='WebGPU 加速'; }
    else{ accelBadge.classList.add('cpu'); accelText.textContent='CPU 処理'; }
  }

  /* ---------- progress overlay ---------- */
  function showProgress(text,sub){ progress.classList.add('show'); progressText.textContent=text||''; progressSub.textContent=sub||''; setFill(0); }
  function setFill(p){ progressFill.style.width=Math.round(p*100)+'%'; }
  function hideProgress(){ progress.classList.remove('show'); }

  /* ---------- script loader ---------- */
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script load failed: '+src)); document.head.appendChild(s); }); }

  /* ---------- scale selector ---------- */
  modelSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    modelSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    modelId=b.dataset.model;
  }));
  scaleSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    scaleSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    upscaleFactor=parseFloat(b.dataset.scale);
  }));

  /* ---------- model registry ---------- */
  // waifu2x swin_unet 4x models (nunif, MIT), exported to ONNX with nunif's exporter.
  // pad: edge padding the official web app uses per style. tile: per backend on desktop (the official
  // app recommends >= 256 for photo); mobile overrides it, see tileFor().
  const MODELS={
    photo:  { url:'models/waifu2x-photo/noise1_scale4x.onnx', key:'waifu2x-photo-noise1-4x', pad:'reflect',
              scale:4, offset:32, blend:16, tile:{ webgpu:256, wasm:256 } },
    illust: { url:'models/waifu2x-art/noise0_scale4x.onnx',   key:'waifu2x-art-noise0-4x',   pad:'replicate',
              scale:4, offset:32, blend:16, tile:{ webgpu:256, wasm:112 } }
  };
  let modelId='photo';
  const MAX_INPUT_DIM=1536;
  try{ indexedDB.deleteDatabase('tensorflowjs'); }catch{}  // models of the removed TF.js engine

  // lightweight pixel buffer
  function makeImg(w,h,data){ return {width:w,height:h,data:data||new Uint8ClampedArray(w*h*4)}; }

  function applyResult(img, w0, h0){
    const tmp=document.createElement('canvas'); tmp.width=img.width; tmp.height=img.height;
    tmp.getContext('2d').putImageData(new ImageData(img.data,img.width,img.height),0,0);
    const fw=Math.round(w0*upscaleFactor), fh=Math.round(h0*upscaleFactor);
    // downscale the 4x result to the target factor in halving steps to avoid aliasing (4x -> 2x -> 1.5x)
    let src=tmp;
    while(src.width/2>=fw && src.height/2>=fh && src.width>fw){
      const half=document.createElement('canvas'); half.width=Math.round(src.width/2); half.height=Math.round(src.height/2);
      const hctx=half.getContext('2d'); hctx.imageSmoothingEnabled=true; hctx.imageSmoothingQuality='high';
      hctx.drawImage(src,0,0,half.width,half.height); src=half;
    }
    base.width=fw; base.height=fh; comp.width=fw; comp.height=fh;
    bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality='high';
    bctx.clearRect(0,0,fw,fh); bctx.drawImage(src,0,0,src.width,src.height,0,0,fw,fh);
    operations=[]; redoStack=[];
    buildComposite(); resize(); fitView(); updateEditState();
  }

  /* ---------- waifu2x engine (ONNX Runtime Web) ---------- */
  const ORT_V='1.29.0', MODEL_CACHE='image-studio-models';
  const ortSessions={};  // key -> {session, ep}

  async function loadOrt(){
    if(window.ort) return true;
    try{ await loadScript(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_V}/dist/ort.min.js`); }catch{ return false; }
    // multi-threading only works when cross-origin isolated
    ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency||1) : 1;
    return true;
  }

  // ONNX models live in their own Cache Storage bucket, kept across app updates
  async function fetchModelBytes(url){
    let cache=null;
    try{ cache=await caches.open(MODEL_CACHE); const hit=await cache.match(url); if(hit) return new Uint8Array(await hit.arrayBuffer()); }catch{}
    progressText.textContent='モデルをダウンロード中…'; setFill(0);
    const res=await fetch(url);
    if(!res.ok) throw new Error(`model download failed (${res.status})`);
    const total=+res.headers.get('content-length')||0, chunks=[]; let got=0;
    const reader=res.body.getReader();
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      chunks.push(value); got+=value.length; if(total) setFill(Math.min(got/total,1));
    }
    const bytes=new Uint8Array(got); let o=0; for(const c of chunks){ bytes.set(c,o); o+=c.length; }
    try{ if(cache) await cache.put(url,new Response(bytes)); }catch{}
    return bytes;
  }

  function swinTileSize(t){ while((t-16)%12||(t-16)%16) t++; return t; }  // swin_unet tile constraint
  // Phones/tablets use 112px tiles: at 256 the model's intermediates reach ~84MB per tensor and
  // crashed iPhone Safari; 112 needs ~1/6 of that and gives visually identical output (no seams).
  const IS_MOBILE=/Android|iPhone|iPad|iPod/.test(navigator.userAgent)
    ||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);  // iPadOS reports as Mac
  const tileFor=(cfg,ep)=>swinTileSize(IS_MOBILE?112:cfg.tile[ep]);
  // Fixing the input size lets ORT fold the shape/mask subgraphs away at load time
  // (1702 -> 672 nodes); otherwise Mod/ConstantOfShape fall back to CPU on WebGPU every tile.
  function createSession(bytes, ep, tile){
    return ort.InferenceSession.create(bytes,{ executionProviders:[ep],
      freeDimensionOverrides:{ batch_size:1, input_height:tile, input_width:tile } });
  }
  async function getOrtSession(cfg, wasmReason){  // wasmReason: non-empty forces WASM
    const cached=ortSessions[cfg.key];
    if(cached&&!(wasmReason&&cached.ep!=='wasm')) return cached;
    const bytes=await fetchModelBytes(cfg.url);
    progressText.textContent='モデルを準備中…';
    let session=null, ep='wasm', gpuError=wasmReason||'';
    if(!wasmReason&&navigator.gpu){
      try{
        if(!ort.env.webgpu.adapter){
          const adapter=await requestGpuAdapter();
          if(!adapter) throw new Error('GPU adapter not found');
          ort.env.webgpu.adapter=adapter;
        }
        session=await createSession(bytes,'webgpu',tileFor(cfg,'webgpu')); ep='webgpu';
      }catch(e){ session=null; gpuError=String(e&&e.message||e); console.warn('waifu2x: WebGPU unavailable, using WASM:',e); }
    }
    if(!session){ session=await createSession(bytes,'wasm',tileFor(cfg,'wasm')); ep='wasm'; }
    return ortSessions[cfg.key]={session, ep, gpuError, tile:tileFor(cfg,ep)};
  }

  // waifu2x tiled rendering with seam blending (port of nunif/utils/seam_blending.py).
  // Output rows are finalized one tile row at a time, so the float buffers only span one tile row.
  async function enlargeWaifu2x(src, sess, cfg){
    const {scale, offset, blend}=cfg, W=src.width, H=src.height, OW=W*scale, OH=H*scale;
    const tile=sess.tile;
    const inOff=Math.ceil(offset/scale), inStep=tile-(inOff*2+Math.ceil(blend/scale));
    const T=tile*scale-offset*2, outStep=inStep*scale;   // model output size / output tile step
    let hb=0, wb=0, ih=0, iw=0;
    while(ih<H+inOff*2){ ih=hb*inStep+tile; hb++; }
    while(iw<W+inOff*2){ iw=wb*inStep+tile; wb++; }
    const BW=iw*scale;
    // blend filter: (d+1)/(blend+1) within `blend` px of the edge, 1 inside
    const filt=new Float32Array(T*T);
    for(let y=0;y<T;y++) for(let x=0;x<T;x++){
      const d=Math.min(x,y,T-1-x,T-1-y); filt[y*T+x]= d<blend ? (d+1)/(blend+1) : 1;
    }
    const plane=T*BW, acc=new Float32Array(plane*3), wsum=new Float32Array(plane);
    const out=makeImg(OW,OH), tin=new Float32Array(3*tile*tile), tt=tile*tile, sd=src.data;
    const edge=cfg.pad==='reflect'
      ? (i,n)=>{ if(n===1) return 0; const p=2*(n-1); i=((i%p)+p)%p; return i<n?i:p-i; }
      : (i,n)=>Math.min(Math.max(i,0),n-1);
    const total=hb*wb; let done=0;
    for(let hi=0;hi<hb;hi++){
      for(let wi=0;wi<wb;wi++){
        // input tile with edge padding: RGBA -> CHW float
        const iy=hi*inStep-inOff, ix=wi*inStep-inOff;
        for(let y=0;y<tile;y++){
          const sy=edge(iy+y,H);
          for(let x=0;x<tile;x++){
            const sx=edge(ix+x,W), si=(sy*W+sx)*4, ti=y*tile+x;
            tin[ti]=sd[si]/255; tin[tt+ti]=sd[si+1]/255; tin[2*tt+ti]=sd[si+2]/255;
          }
        }
        const res=await sess.session.run({x:new ort.Tensor('float32',tin,[1,3,tile,tile])});
        const yv=res.y.data, TT=T*T, x0=wi*outStep;
        for(let y=0;y<T;y++){
          const row=y*BW+x0, frow=y*T;
          for(let x=0;x<T;x++){
            const w=filt[frow+x], bi=row+x, ti=frow+x;
            wsum[bi]+=w; acc[bi]+=w*yv[ti]; acc[plane+bi]+=w*yv[TT+ti]; acc[2*plane+bi]+=w*yv[2*TT+ti];
          }
        }
        res.y.dispose&&res.y.dispose();
        done++; setFill(done/total); progressText.textContent=`処理中… ${Math.round(done/total*100)}%`;
        await new Promise(r=>setTimeout(r));
      }
      // write out the rows this tile row finalized, then shift the overlap to the top
      const last=hi===hb-1, rows=last?T:outStep, base=hi*outStep, od=out.data;
      for(let r=0;r<rows;r++){
        const gy=base+r; if(gy>=OH) break;
        for(let gx=0;gx<OW;gx++){
          const bi=r*BW+gx, inv=255/wsum[bi], oi=(gy*OW+gx)*4;
          od[oi]=acc[bi]*inv+0.5; od[oi+1]=acc[plane+bi]*inv+0.5; od[oi+2]=acc[2*plane+bi]*inv+0.5; od[oi+3]=255;
        }
      }
      if(!last){
        const keep=(T-outStep)*BW;
        for(let c=0;c<3;c++){ const p0=c*plane; acc.copyWithin(p0,p0+outStep*BW,p0+plane); acc.fill(0,p0+keep,p0+plane); }
        wsum.copyWithin(0,outStep*BW,plane); wsum.fill(0,keep,plane);
      }
    }
    return out;
  }

  async function upscaleWaifu2x(input, cfg){
    let sess=await getOrtSession(cfg,'');
    // when WebGPU was unusable, show why (shortened) so it can be reported
    const label=s=>`バックエンド: ${s.ep==='webgpu'?'WebGPU':'CPU (WASM)'} ／ ${upscaleFactor}×`
      +(s.ep!=='webgpu'&&s.gpuError?` ／ WebGPU不可: ${s.gpuError.slice(0,60)}`:'');
    progressText.textContent='処理中… 0%'; progressSub.textContent=label(sess); setFill(0);
    try{ return await enlargeWaifu2x(input, sess, cfg); }
    catch(err){
      if(sess.ep!=='webgpu') throw err;
      // WebGPU failed: retry on WASM
      console.warn('waifu2x: WebGPU run failed, retrying on WASM:',err);
      sess=await getOrtSession(cfg,String(err&&err.message||err));
      progressText.textContent='処理中… 0%'; progressSub.textContent=label(sess); setFill(0);
      return await enlargeWaifu2x(input, sess, cfg);
    }
  }

  /* ---------- upscale button ---------- */
  let upscaling=false;
  upscaleBtn.addEventListener('click', async ()=>{
    if(!hasImage||upscaling) return;
    if(comp.width>MAX_INPUT_DIM||comp.height>MAX_INPUT_DIM){
      showProgress('画像が大きすぎます',`長辺 ${MAX_INPUT_DIM}px 以下の画像でお試しください（現在 ${comp.width}×${comp.height}）`);
      setTimeout(hideProgress,3200); return;
    }
    upscaling=true; upscaleBtn.disabled=true;
    const cfg=MODELS[modelId];
    showProgress('AIエンジンを準備中…','ONNX Runtime を読み込んでいます');
    try{
      if(!await loadOrt()){ progressText.textContent='エンジンの読み込みに失敗'; progressSub.textContent='オンライン環境でお試しください'; setTimeout(hideProgress,2800); return; }
      const w0=comp.width, h0=comp.height;
      const src=cctx.getImageData(0,0,w0,h0);
      const result=await upscaleWaifu2x(makeImg(w0,h0,new Uint8ClampedArray(src.data)), cfg);
      progressText.textContent='画像を生成中…';
      applyResult(result, w0, h0);
      hideProgress();
    }catch(err){
      progressText.textContent='処理に失敗しました'; progressSub.textContent=String(err&&err.message||err).slice(0,120);
      setTimeout(hideProgress,3200);
    }finally{ upscaling=false; upscaleBtn.disabled=false; }
  });

  /* ---------- resize ---------- */
  function resize(){
    dpr=window.devicePixelRatio||1;
    const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return;
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    if(hasImage){ clampPan(); render(); }
  }
  new ResizeObserver(()=>resize()).observe(stage);
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));

  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
  syncStrengthLabel(); syncToolUI(); resize(); refreshUI();
})();
</script>
