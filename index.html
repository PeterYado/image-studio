<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Image Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5FA; --surface:#FFFFFF; --canvas-bg:#211B29; --ink:#1A1320; --ink-soft:#6B6478;
    --line:#E7E2EE; --accent:#6B3FA0; --accent-deep:#4A2873; --accent-wash:#F0EBF7;
    --radius:14px; --shadow:0 1px 2px rgba(26,19,32,.04),0 8px 24px rgba(74,40,115,.06);
    --font:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;user-select:none;}

  header{flex:none;padding:max(14px,env(safe-area-inset-top)) 20px 0;display:flex;flex-direction:column;gap:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative;flex:none;}
  .brand-mark::before{content:"";position:absolute;inset:6px 6px auto auto;width:8px;height:8px;background:var(--bg);border-radius:2px;box-shadow:-10px 0 0 var(--bg),0 10px 0 var(--bg),-10px 10px 0 rgba(247,245,250,.55);}
  .brand h1{font-size:17px;font-weight:900;letter-spacing:.04em;}
  .brand h1 span{color:var(--accent);}

  .tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line);width:fit-content;}
  .tab{appearance:none;border:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:700;color:var(--ink-soft);background:transparent;padding:9px 22px;border-radius:9px;transition:color .18s,background .18s;letter-spacing:.02em;}
  .tab.active{color:#fff;background:var(--accent);}
  .tab:disabled{opacity:.35;cursor:not-allowed;}

  /* tool panel */
  .toolpanel{flex:none;margin:14px 20px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:none;flex-wrap:wrap;align-items:center;gap:10px 18px;}
  .toolpanel.show{display:flex;}
  .group{display:flex;align-items:center;gap:8px;}
  .group-label{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap;}
  .seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .seg button{appearance:none;border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;color:var(--ink-soft);background:transparent;padding:7px 13px;border-radius:7px;transition:color .15s,background .15s;}
  .seg button.on{color:#fff;background:var(--accent);}
  .ctl{display:flex;align-items:center;gap:10px;flex:1;min-width:160px;}
  .ctl > label{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .ctl .val{font-size:12px;font-weight:700;color:var(--accent-deep);min-width:26px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:70px;height:4px;border-radius:99px;background:var(--line);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(74,40,115,.4);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 1px 4px rgba(74,40,115,.4);cursor:pointer;}
  .panel-actions{display:flex;gap:8px;}

  /* emoji sticker panel */
  .emoji-panel{display:none;align-items:center;gap:10px;}
  .emoji-panel.show{display:flex;}
  .stamp-trigger{appearance:none;border:1px solid var(--line);background:var(--bg);cursor:pointer;width:42px;height:42px;border-radius:10px;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s,background .15s;}
  .stamp-trigger:hover{background:var(--accent-wash);}
  .stamp-trigger:active{transform:scale(.92);}

  /* emoji picker (popover on desktop, bottom sheet on mobile) */
  .emoji-picker-backdrop{position:fixed;inset:0;z-index:40;display:none;}
  .emoji-picker-backdrop.show{display:block;}
  .emoji-picker{position:fixed;z-index:41;display:none;flex-direction:column;width:368px;max-height:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(26,19,32,.25);overflow:hidden;}
  .emoji-picker.show{display:flex;}
  .emoji-cats{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;}
  .emoji-cats button{appearance:none;border:none;background:transparent;font-size:20px;width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none;line-height:1;}
  .emoji-cats button.on{background:var(--accent-wash);}
  .emoji-scroll{overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;min-height:80px;}
  .emoji-scroll button{appearance:none;border:none;background:transparent;font-size:24px;width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .emoji-scroll button:hover{background:var(--accent-wash);}
  .emoji-scroll .empty{grid-column:1/-1;color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 8px;}
  @media(max-width:640px){
    .emoji-picker{left:0!important;right:0!important;bottom:0!important;top:auto!important;width:auto;max-height:48vh;border-radius:16px 16px 0 0;border-bottom:none;}
    .emoji-scroll{grid-template-columns:repeat(6,1fr);}
  }

  /* color picker for box fill */
  .color-trigger{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;background:#000;transition:transform .1s;}
  .color-trigger:active{transform:scale(.92);}
  .color-picker-backdrop{position:fixed;inset:0;z-index:40;display:none;}
  .color-picker-backdrop.show{display:block;}
  .color-picker{position:fixed;z-index:41;display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(26,19,32,.25);padding:12px;grid-template-columns:repeat(10,1fr);gap:7px;}
  .color-picker.show{display:grid;}
  .color-picker button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;}
  .color-picker button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);}
  .color-picker button .chk{font-size:13px;font-weight:700;}
  @media(max-width:640px){
    .color-picker{left:0!important;right:0!important;bottom:0!important;top:auto!important;border-radius:16px 16px 0 0;justify-content:center;}
  }

  /* upscale panel */
  .uppanel{flex:none;margin:14px 20px 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:none;align-items:center;gap:14px;flex-wrap:wrap;}
  .uppanel.show{display:flex;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;}
  .badge.gpu{background:#E7F8EE;color:#1B7A43;}
  .badge.cpu{background:#FFF4E0;color:#9A6700;}
  .badge.none{background:#FCE8E8;color:#B42318;}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .up-actions{margin-left:auto;display:flex;gap:8px;}
  /* convert: target size + output size readout */
  .target{display:flex;align-items:center;gap:6px;}
  .target input{width:72px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);}
  .target span{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .sizeinfo{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .sizeinfo b{color:var(--accent-deep);font-variant-numeric:tabular-nums;}
  /* pdf panel */
  .pager{display:flex;align-items:center;gap:6px;}
  .pager span{font-size:13px;font-weight:700;color:var(--ink);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}
  .pdf-text input{width:240px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);}
  .pdf-note{font-size:13px;color:var(--ink-soft);}
  .stamp-group{flex-wrap:wrap;}
  .stamp-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .stamp-list .none{font-size:12px;color:var(--ink-soft);}
  .stamp-item{position:relative;width:44px;height:44px;padding:3px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
    background:#fff repeating-conic-gradient(#ececec 0 25%,#fff 0 50%) 0 0/10px 10px;}
  .stamp-item img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
  .stamp-item.on{outline:2px solid var(--accent);outline-offset:1px;}
  .stamp-item .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;padding:0;border:none;border-radius:50%;
    background:var(--ink);color:#fff;font-size:11px;line-height:18px;cursor:pointer;}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}

  /* progress overlay */
  .progress{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(26,19,32,.6);backdrop-filter:blur(4px);padding:32px;text-align:center;}
  .progress.show{display:flex;}
  .progress .ptext{color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em;}
  .progress .pbar{width:min(280px,70%);height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;}
  .progress .pfill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s;}
  .progress .psub{color:rgba(255,255,255,.65);font-size:12px;line-height:1.5;max-width:320px;}

  @media (max-width:640px){
    .uppanel{gap:10px;}
    .up-actions{margin-left:0;flex:1;}
    .up-actions .btn{flex:1;justify-content:center;}
    .sizeinfo{flex-basis:100%;}
    .pdf-text{flex-basis:100%;}
    .pdf-text input{flex:1;width:auto;min-width:0;}
  }

  main{flex:1;min-height:0;padding:14px 20px;display:flex;}
  .stage{flex:1;border-radius:var(--radius);background:var(--canvas-bg);position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.025) 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;pointer-events:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;touch-action:none;}
  canvas.loaded{display:block;}

  .zoomctl{position:absolute;right:12px;bottom:12px;z-index:4;display:none;gap:6px;padding:5px;background:rgba(26,19,32,.55);backdrop-filter:blur(8px);border-radius:12px;}
  .zoomctl.show{display:flex;}
  .zoomctl button{appearance:none;border:none;cursor:pointer;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .zoomctl button:hover{background:rgba(255,255,255,.18);}
  .zoomctl button:active{transform:scale(.94);}
  .zoomctl button svg{width:18px;height:18px;}
  .zoomlabel{position:absolute;left:12px;bottom:14px;z-index:4;display:none;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(26,19,32,.5);padding:6px 11px;border-radius:9px;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;}
  .zoomlabel.show{display:block;}

  .drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;z-index:5;transition:background .18s;}
  .drop.hide{display:none;}
  .drop.over{background:rgba(107,63,160,.16);}
  .drop-ico{width:56px;height:56px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;}
  .drop-ico svg{width:26px;height:26px;stroke:rgba(255,255,255,.7);}
  .drop p{color:rgba(255,255,255,.78);font-size:14px;font-weight:500;line-height:1.5;}
  .drop p b{color:#fff;font-weight:700;}
  .drop .pick{margin-top:4px;appearance:none;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:14px;color:var(--accent-deep);background:#fff;padding:11px 24px;border-radius:10px;transition:transform .12s;}
  .drop .pick:active{transform:scale(.96);}

  .toolbar{flex:none;padding:10px 20px max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;}
  .tool-hint{flex:1;font-size:12.5px;color:var(--ink-soft);font-weight:500;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tool-hint b{color:var(--accent-deep);}
  .btn{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:14px;padding:11px 20px;border-radius:11px;transition:transform .12s,opacity .18s,background .18s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .btn:active{transform:scale(.96);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn svg{width:16px;height:16px;}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
  .btn-primary{background:var(--accent);border:1px solid var(--accent);color:#fff;}
  .btn-sm{padding:9px 14px;font-size:13px;}

  .wip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.6);background:rgba(0,0,0,.25);padding:6px 14px;border-radius:99px;backdrop-filter:blur(6px);display:none;}
  .wip.show{display:block;}

  @media (max-width:640px){
    .brand h1{font-size:16px;}
    .tab{padding:9px 0;flex:1;text-align:center;}
    .tabs{width:100%;}
    .toolpanel{gap:10px 12px;}
    .ctl{flex-basis:100%;min-width:0;}
    .panel-actions{flex:1;}
    .panel-actions .btn{flex:1;justify-content:center;}
    .btn{padding:11px 16px;}
    .tool-hint{display:none;}
    .toolbar{gap:8px;}
    .toolbar .btn{flex:1;justify-content:center;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-mark"></div><h1>IMAGE <span>STUDIO</span></h1></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="mosaic" role="tab">モザイク</button>
      <button class="tab" data-tab="upscale" role="tab">画質アップ</button>
      <button class="tab" data-tab="convert" role="tab">形式変換</button>
      <button class="tab" data-tab="pdf" role="tab">PDF</button>
    </div>
  </header>

  <div class="toolpanel" id="toolpanel">
    <div class="group">
      <span class="group-label">種類</span>
      <div class="seg" id="effectSeg">
        <button data-effect="pixelate" class="on">ピクセル</button>
        <button data-effect="blur">ぼかし</button>
        <button data-effect="box">ベタ塗り</button>
        <button data-effect="sticker">スタンプ</button>
      </div>
    </div>
    <div class="group" id="modeGroup">
      <span class="group-label">方式</span>
      <div class="seg" id="modeSeg">
        <button data-mode="rect" class="on">四角</button>
        <button data-mode="brush">ブラシ</button>
      </div>
    </div>
    <div class="ctl" id="strengthCtl">
      <label id="strengthLabel">粗さ</label>
      <input type="range" id="strength" min="6" max="80" value="22" step="1">
      <span class="val" id="strengthVal">22</span>
    </div>
    <div class="ctl" id="colorCtl" style="display:none;">
      <label>塗り</label>
      <button type="button" class="color-trigger" id="colorTrigger"></button>
    </div>
    <div class="ctl" id="brushCtl" style="display:none;">
      <label>太さ</label>
      <input type="range" id="brushSize" min="10" max="200" value="60" step="2">
      <span class="val" id="brushSizeVal">60</span>
    </div>
    <div class="emoji-panel" id="emojiPanel">
      <span class="group-label">スタンプ</span>
      <button type="button" class="stamp-trigger" id="stampTrigger">🙂</button>
    </div>
    <div class="panel-actions">
      <button class="btn btn-ghost btn-sm" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
        元に戻す
      </button>
      <button class="btn btn-ghost btn-sm" id="clearBtn" disabled>すべて消去</button>
    </div>
  </div>

  <div class="uppanel" id="uppanel">
    <div class="group">
      <span class="group-label">モデル</span>
      <div class="seg" id="modelSeg">
        <button data-model="photo" class="on">写真</button>
        <button data-model="illust">イラスト</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">倍率</span>
      <div class="seg" id="scaleSeg">
        <button data-scale="1.5">1.5×</button>
        <button data-scale="2" class="on">2×</button>
        <button data-scale="4">4×</button>
      </div>
    </div>
    <span class="badge none" id="accelBadge"><span class="dot"></span><span id="accelText">確認中…</span></span>
    <div class="up-actions">
      <button class="btn btn-primary btn-sm" id="upscaleBtn">画質を上げる</button>
    </div>
  </div>

  <div class="uppanel" id="convpanel">
    <div class="group">
      <span class="group-label">形式</span>
      <div class="seg" id="formatSeg">
        <button data-fmt="jpg" class="on">JPG</button>
        <button data-fmt="png">PNG</button>
        <button data-fmt="svg">SVG</button>
      </div>
    </div>
    <div class="ctl" id="qualityCtl">
      <label>画質</label>
      <input type="range" id="quality" min="50" max="100" value="92" step="1">
      <span class="val" id="qualityVal">92</span>
    </div>
    <div class="group" id="targetCtl">
      <span class="group-label">目標サイズ</span>
      <div class="target">
        <input type="number" id="targetMB" min="0.1" step="0.1" inputmode="decimal" placeholder="例: 10">
        <span>MB 以下</span>
        <button class="btn btn-ghost btn-sm" id="targetBtn">自動調整</button>
      </div>
    </div>
    <div class="sizeinfo" id="sizeInfo"></div>
    <div class="up-actions">
      <button class="btn btn-primary btn-sm" id="convertBtn">変換して保存</button>
    </div>
  </div>

  <div class="uppanel" id="pdfpanel">
    <span class="pdf-note" id="pdfNote">PDF ファイルを開くと、文字を書き込めます</span>
    <button class="btn btn-ghost btn-sm" id="pdfOpenBtn">PDFを開く</button>
    <div class="group pdf-only" id="pdfPager">
      <span class="group-label">ページ</span>
      <div class="pager"><button class="btn btn-ghost btn-sm" id="pdfPrev" aria-label="前のページ">◀</button><span id="pdfPageLabel">1 / 1</span><button class="btn btn-ghost btn-sm" id="pdfNext" aria-label="次のページ">▶</button></div>
    </div>
    <div class="group pdf-only">
      <span class="group-label">ツール</span>
      <div class="seg" id="pdfToolSeg"><button data-tool="text" class="on">文字</button><button data-tool="stamp">印鑑</button><button data-tool="pen">ペン</button></div>
    </div>
    <div class="group pdf-text pdf-only pt-text">
      <span class="group-label">文字</span>
      <input type="text" id="pdfText" placeholder="入力してからページをタップ" enterkeyhint="done">
    </div>
    <div class="ctl pdf-only pt-text">
      <label>サイズ</label>
      <input type="range" id="pdfSize" min="6" max="40" value="11" step="0.5">
      <span class="val" id="pdfSizeVal">11</span>
    </div>
    <div class="group pdf-only pt-text">
      <span class="group-label">書体</span>
      <div class="seg" id="pdfFontSeg"><button data-font="mincho" class="on">明朝</button><button data-font="gothic">ゴシック</button></div>
    </div>
    <div class="group pdf-only pt-stamp stamp-group">
      <span class="group-label">印鑑</span>
      <div class="stamp-list" id="stampList"></div>
      <button class="btn btn-ghost btn-sm" id="stampAddBtn">＋ 登録</button>

  <main>

        <p>写真・PDF を<b>ドラッグ＆ドロップ</b><br>または下のボタンから選択</p>

  <div class="toolbar">
    <div class="tool-hint" id="hint">写真を読み込んでください</div>
    <button class="btn btn-ghost" id="replaceBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>

  <input type="file" id="fileInput" accept="image/*,application/pdf,.pdf" hidden>

  <div class="color-picker-backdrop" id="colorBackdrop"></div>
  <div class="color-picker" id="colorPicker"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const stage=$('stage'), canvas=$('canvas'), ctx=canvas.getContext('2d');
  const drop=$('drop'), wip=$('wip'), hint=$('hint');
  const fileInput=$('fileInput'), saveBtn=$('saveBtn'), replaceBtn=$('replaceBtn'), pickEmpty=$('pickEmpty');
  const tabs=document.querySelectorAll('.tab');
  const toolpanel=$('toolpanel'), effectSeg=$('effectSeg'), modeSeg=$('modeSeg');
  const modeGroup=$('modeGroup'), strengthCtl=$('strengthCtl'), colorCtl=$('colorCtl'), emojiPanel=$('emojiPanel');
  const strength=$('strength'), strengthVal=$('strengthVal'), strengthLabel=$('strengthLabel');
  const brushCtl=$('brushCtl'), brushSize=$('brushSize'), brushSizeVal=$('brushSizeVal');
  const undoBtn=$('undoBtn'), clearBtn=$('clearBtn'), zoomctl=$('zoomctl'), zoomlabel=$('zoomlabel');
  const uppanel=$('uppanel'), scaleSeg=$('scaleSeg'), modelSeg=$('modelSeg'), accelBadge=$('accelBadge'), accelText=$('accelText'), upscaleBtn=$('upscaleBtn');
  const progress=$('progress'), progressText=$('progressText'), progressFill=$('progressFill'), progressSub=$('progressSub');
  const convpanel=$('convpanel'), formatSeg=$('formatSeg'), qualityCtl=$('qualityCtl'), quality=$('quality'), qualityVal=$('qualityVal'), convertBtn=$('convertBtn');
  const targetCtl=$('targetCtl'), targetMB=$('targetMB'), targetBtn=$('targetBtn'), sizeInfo=$('sizeInfo');
  const pdfpanel=$('pdfpanel'), pdfNote=$('pdfNote'), pdfOpenBtn=$('pdfOpenBtn'), pdfPrev=$('pdfPrev'), pdfNext=$('pdfNext'), pdfPageLabel=$('pdfPageLabel');
  const pdfText=$('pdfText'), pdfSize=$('pdfSize'), pdfSizeVal=$('pdfSizeVal'), pdfFontSeg=$('pdfFontSeg'), pdfColorSeg=$('pdfColorSeg');
  const pdfDelBtn=$('pdfDelBtn'), pdfUndoBtn=$('pdfUndoBtn'), pdfSaveBtn=$('pdfSaveBtn'), pdfToolSeg=$('pdfToolSeg');
  const stampList=$('stampList'), stampAddBtn=$('stampAddBtn'), stampWhite=$('stampWhite'), stampInput=$('stampInput');
  const stampSize=$('stampSize'), stampSizeVal=$('stampSizeVal'), penWidth=$('penWidth'), penWidthVal=$('penWidthVal');

  let currentTab='mosaic', hasImage=false, sourceName='image', sourceBytes=0;
  let compVersion=0;  // bumped on every composite rebuild; keys the cached output encode
  let effect='pixelate', mode='rect';
  let selStickerIdx=-1;   // index in operations of currently selected sticker (-1 = none)
  let fillColor='#000000';  // current ベタ塗り color ("color to paint next")
  let upscaleFactor=2, accelTier=null;
  let outFormat='jpg';
  // PDF mode: {doc (pdf.js), bytes (original file), cur, pages:[{ops, redo, vp, rs}]}; null for images
  let pdfDoc=null, selItemIdx=-1, itemDrag=null, pdfFont='mincho', pdfColor='#000000';
  let pdfTool='text', myStamps=[], curStamp=null, penPts=null;  // tool: 'text' | 'stamp' | 'pen'

  // layers
  const base=document.createElement('canvas'), bctx=base.getContext('2d');
  const comp=document.createElement('canvas'), cctx=comp.getContext('2d');

  // operation model (generalized):
  //   {effect:'pixelate'|'blur'|'box', strength, shape:'rect'|'path', rect:{x,y,w,h} | path:[{x,y}], thickness}
  let operations=[];     // committed
  let redoStack=[];

  // view
  let scale=1, ox=0, oy=0, minScale=.05, maxScale=16, dpr=1;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

  /* ---------- effect application ---------- */
  function applyOp(op){
    if(op.type==='text'){ if(op.text&&pdfDoc) drawText(cctx,op,op.pt*pageRS(),op.x,op.y); return; }
    if(op.type==='stamp'){ const b=itemBox(op); cctx.drawImage(op.stamp.img,b.x,b.y,b.w,b.h); return; }
    if(op.type==='pen'){ strokePen(cctx,op.pts,op.w*pageRS(),op.color); return; }
    if(op.type==='sticker') drawSticker(op);
    else if(op.shape==='rect') applyRectEffect(op.rect, op.effect, op.strength, op.color);
    else applyPathEffect(op.path, op.thickness, op.effect, op.strength, op.color);
  }

  function drawSticker(op){
    cctx.save();
    cctx.translate(op.cx, op.cy);
    cctx.rotate(op.angle||0);
    cctx.font=`${op.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    cctx.textAlign='center'; cctx.textBaseline='middle';
    cctx.fillText(op.emoji, 0, 0);
    cctx.restore();
  }

  // PDF text: system Japanese fonts, so on-screen and saved text look the same without a font download
  const PDF_FONTS={
    mincho:'"Hiragino Mincho ProN","Yu Mincho","YuMincho","BIZ UDPMincho","Noto Serif JP","IPAMincho",serif',
    gothic:'"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP","IPAGothic",sans-serif'};
  function textMetrics(c,op,px){
    c.font=`${px}px ${PDF_FONTS[op.font]||PDF_FONTS.mincho}`;
    const m=c.measureText(op.text||' ');
    return {w:m.width, asc:m.fontBoundingBoxAscent??px*0.88, desc:m.fontBoundingBoxDescent??px*0.12};
  }
  // draws with the box's top-left at (x,y)
  function drawText(c,op,px,x,y){
    const t=textMetrics(c,op,px); c.fillStyle=op.color; c.textBaseline='alphabetic'; c.fillText(op.text,x,y+t.asc); return t;
  }
  const pageRS=()=>pdfDoc.pages[pdfDoc.cur].rs;  // page-view px per PDF point
  // box of a text or stamp in page-view px (rs: px per point of the page it is on)
  function itemBox(op,rs=pageRS()){
    if(op.type==='stamp'){
      const side=op.mm*72/25.4*rs, ar=op.stamp.w/op.stamp.h;  // mm sets the longer side
      return {x:op.x,y:op.y,w:ar>=1?side:side*ar,h:ar>=1?side/ar:side};
    }
    const t=textMetrics(cctx,op,op.pt*rs); return {x:op.x,y:op.y,w:t.w,h:t.asc+t.desc};
  }
  // pen stroke, smoothed with quadratic curves through segment midpoints; (tx,ty,s) maps page-view px
  function strokePen(c,pts,w,color,tx=0,ty=0,s=1){
    const P=i=>({x:(pts[i].x-tx)*s,y:(pts[i].y-ty)*s}), n=pts.length;
    c.save(); c.strokeStyle=c.fillStyle=color; c.lineWidth=w; c.lineCap='round'; c.lineJoin='round'; c.beginPath();
    if(n<3){
      const a=P(0), b=P(n-1);
      if(Math.hypot(a.x-b.x,a.y-b.y)<0.01){ c.arc(a.x,a.y,w/2,0,Math.PI*2); c.fill(); }
      else{ c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    }else{
      const a=P(0); c.moveTo(a.x,a.y);
      for(let i=1;i<n-1;i++){ const p=P(i), q=P(i+1); c.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2); }
      const l=P(n-1); c.lineTo(l.x,l.y); c.stroke();
    }
    c.restore();
  }

  // Build a processed (pixelated/blurred/box) full-frame layer from current comp, then
  // paint it back only inside the given mask. This keeps brush & rect on one code path.
  function processedLayer(effectType, strength, color){
    const layer=document.createElement('canvas'); layer.width=comp.width; layer.height=comp.height;
    const lctx=layer.getContext('2d');
    if(effectType==='pixelate'){
      const b=Math.max(2,strength);
      const tw=Math.max(1,Math.round(comp.width/b)), th=Math.max(1,Math.round(comp.height/b));
      const tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th;
      const tctx=tmp.getContext('2d'); tctx.imageSmoothingEnabled=false;
      tctx.drawImage(comp,0,0,comp.width,comp.height,0,0,tw,th);
      lctx.imageSmoothingEnabled=false;
      lctx.drawImage(tmp,0,0,tw,th,0,0,comp.width,comp.height);
    }else if(effectType==='blur'){
      // Multi-step down/up scaling approximates a smooth (gaussian-like) blur,
      // without relying on ctx.filter (unsupported on iOS Safari).
      const f=Math.max(2,strength*0.6);
      const targetW=Math.max(1,Math.round(comp.width/f)), targetH=Math.max(1,Math.round(comp.height/f));
      let cur=comp, cw=comp.width, ch=comp.height;
      const step=(nw,nh)=>{ const c=document.createElement('canvas'); c.width=nw; c.height=nh; const cx=c.getContext('2d'); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high'; cx.drawImage(cur,0,0,cw,ch,0,0,nw,nh); cur=c; cw=nw; ch=nh; };
      while(cw>targetW*2||ch>targetH*2) step(Math.max(targetW,Math.round(cw/2)),Math.max(targetH,Math.round(ch/2)));
      step(targetW,targetH);
      while(cw<comp.width/2||ch<comp.height/2) step(Math.min(comp.width,cw*2),Math.min(comp.height,ch*2));
      lctx.imageSmoothingEnabled=true; lctx.imageSmoothingQuality='high';
      lctx.drawImage(cur,0,0,cw,ch,0,0,comp.width,comp.height);
    }else{ // box: fill with the chosen solid color
      lctx.fillStyle=color||'#000000';
      lctx.fillRect(0,0,comp.width,comp.height);
    }
    return layer;
  }

  function applyRectEffect(r, effectType, strength, color){
    let {x,y,w,h}=r;
    x=Math.max(0,Math.round(x)); y=Math.max(0,Math.round(y));
    w=Math.min(comp.width-x,Math.round(w)); h=Math.min(comp.height-y,Math.round(h));
    if(w<=0||h<=0) return;
    const layer=processedLayer(effectType,strength,color);
    cctx.save(); cctx.beginPath(); cctx.rect(x,y,w,h); cctx.clip();
    cctx.drawImage(layer,0,0); cctx.restore();
  }

  function applyPathEffect(path, thickness, effectType, strength, color){
    if(!path||path.length===0) return;
    const layer=processedLayer(effectType,strength,color);
    maskPaintPath(path, thickness, layer);
  }

  // Paint `layer` only where a thick polyline mask is drawn.
  function maskPaintPath(path, thickness, layer){
    const mask=document.createElement('canvas'); mask.width=comp.width; mask.height=comp.height;
    const mctx=mask.getContext('2d');
    mctx.strokeStyle='#fff'; mctx.fillStyle='#fff';
    mctx.lineJoin='round'; mctx.lineCap='round'; mctx.lineWidth=thickness;
    mctx.beginPath();
    if(path.length===1){ mctx.arc(path[0].x,path[0].y,thickness/2,0,Math.PI*2); mctx.fill(); }
    else{
      mctx.moveTo(path[0].x,path[0].y);
      for(let i=1;i<path.length;i++) mctx.lineTo(path[i].x,path[i].y);
      mctx.stroke();
    }
    // layer masked by stroke
    mctx.globalCompositeOperation='source-in';
    mctx.drawImage(layer,0,0);
    cctx.drawImage(mask,0,0);
  }

  function buildComposite(){
    compVersion++;
    cctx.setTransform(1,0,0,1,0,0); cctx.imageSmoothingEnabled=true;
    cctx.clearRect(0,0,comp.width,comp.height); cctx.drawImage(base,0,0);
    for(const op of operations) applyOp(op);
  }

  /* ---------- render ---------- */
  let preview=null; // live rect {x,y,w,h} or path {pts,thickness} during drag
  function render(){
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!hasImage) return;
    ctx.imageSmoothingEnabled=scale<1.2;
    ctx.setTransform(scale,0,0,scale,ox,oy);
    ctx.drawImage(comp,0,0);
    if(preview){
      ctx.save();
      ctx.strokeStyle='#6B3FA0'; ctx.fillStyle='rgba(107,63,160,0.22)';
      if(preview.rect){
        ctx.lineWidth=1.5*dpr/scale; ctx.setLineDash([8*dpr/scale,5*dpr/scale]);
        ctx.fillRect(preview.rect.x,preview.rect.y,preview.rect.w,preview.rect.h);
        ctx.strokeRect(preview.rect.x,preview.rect.y,preview.rect.w,preview.rect.h);
      }else if(preview.pts){
        ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=preview.thickness;
        ctx.strokeStyle='rgba(107,63,160,0.45)';
        ctx.beginPath();
        if(preview.pts.length===1){ ctx.arc(preview.pts[0].x,preview.pts[0].y,preview.thickness/2,0,Math.PI*2); ctx.fillStyle='rgba(107,63,160,0.45)'; ctx.fill(); }
        else{ ctx.moveTo(preview.pts[0].x,preview.pts[0].y); for(let i=1;i<preview.pts.length;i++) ctx.lineTo(preview.pts[i].x,preview.pts[i].y); ctx.stroke(); }
      }
      ctx.restore();
    }
    if(currentTab==='mosaic' && effect==='sticker' && selStickerIdx>=0 && operations[selStickerIdx]){
      const H=stickerHandles(operations[selStickerIdx]);
      ctx.save();
      ctx.lineWidth=1.5*dpr/scale; ctx.strokeStyle='#6B3FA0'; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(H.corners[0].x,H.corners[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(H.corners[i].x,H.corners[i].y);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(H.topMid.x,H.topMid.y); ctx.lineTo(H.rotate.x,H.rotate.y); ctx.stroke();
      const r=7*dpr/scale; ctx.fillStyle='#fff';
      [H.resize,H.rotate].forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
      ctx.restore();
    }
    if(penPts&&pdfDoc) strokePen(ctx,penPts,parseFloat(penWidth.value)*pageRS(),pdfColor);
    if(currentTab==='pdf' && pdfDoc && selItemIdx>=0 && operations[selItemIdx]){
      const b=itemBox(operations[selItemIdx]), pad=3*dpr/scale;
      ctx.save(); ctx.lineWidth=1.5*dpr/scale; ctx.strokeStyle='#6B3FA0'; ctx.setLineDash([6*dpr/scale,4*dpr/scale]);
      ctx.strokeRect(b.x-pad,b.y-pad,b.w+2*pad,Math.max(b.h,4*dpr/scale)+2*pad); ctx.restore();
    }
    updateZoomLabel();
  }
  function updateZoomLabel(){ zoomlabel.textContent=Math.round((scale/fitScale())*100)+'%'; }

  /* ---------- view helpers ---------- */
  function fitScale(){ return Math.min(canvas.width/base.width, canvas.height/base.height); }
  function fitView(){
    const f=fitScale()*0.985; scale=f; minScale=f*0.9; maxScale=Math.max(f*20,(window.devicePixelRatio||1)*8);
    ox=(canvas.width-base.width*scale)/2; oy=(canvas.height-base.height*scale)/2; render();
  }
  function clampPan(){
    const iw=base.width*scale, ih=base.height*scale;
    ox = iw<=canvas.width ? (canvas.width-iw)/2 : clamp(ox,canvas.width-iw,0);
    oy = ih<=canvas.height ? (canvas.height-ih)/2 : clamp(oy,canvas.height-ih,0);
  }
  function zoomAt(cx,cy,f){
    const ix=(cx-ox)/scale, iy=(cy-oy)/scale;
    scale=clamp(scale*f,minScale,maxScale);
    ox=cx-ix*scale; oy=cy-iy*scale; clampPan(); render();
  }
  function toCanvas(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)}; }
  function canvasToImg(c){ return {x:(c.x-ox)/scale, y:(c.y-oy)/scale}; }

  /* ---------- gestures ---------- */
  const pointers=new Map();
  let gesture=null, startImg=null, panLast=null, pinchPrev=null, spaceHeld=false, brushPts=null, stickerStart=null;
  const canEdit=()=>hasImage&&currentTab==='mosaic';
  const isPanInput=e=>e.button===1||spaceHeld||!canEdit();
  const mid=p=>({x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2});
  const dist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);

  canvas.addEventListener('pointerdown',e=>{
    if(!hasImage) return;
    canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,toCanvas(e));
    if(pointers.size===2){
      gesture='pinch'; preview=null; brushPts=null; penPts=null;
      pinchPrev={mid:mid([...pointers.values()]),dist:dist([...pointers.values()])}; render();
    }else if(pointers.size===1){
      const c=toCanvas(e);
      if(currentTab==='pdf'&&pdfDoc&&e.button!==1&&!spaceHeld){
        // finish any IME conversion first: blurring commits it, so the text field holds its final value
        if(document.activeElement===pdfText) pdfText.blur();
        if(pdfPointerDown(c)){ e.preventDefault(); return; }
      }
      if(canEdit()&&!isPanInput(e)){
        const p=canvasToImg(c);
        if(effect==='sticker'){
          const hit=hitSticker(p,c);
          if(hit){ selStickerIdx=hit.idx; gesture='sticker-'+hit.mode; redoStack=[]; stickerStart={pI:p, op:{...operations[hit.idx]}}; }
          else{ selStickerIdx=-1; gesture=null; }
          render();
        }
        else if(mode==='rect'){ gesture='select'; startImg=p; preview={rect:{x:p.x,y:p.y,w:0,h:0}}; }
        else{ gesture='brush'; brushPts=[p]; preview={pts:brushPts,thickness:parseInt(brushSize.value,10)}; render(); }
      }else{ gesture='pan'; panLast=c; setCursor('grabbing'); }
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,toCanvas(e));
    if(gesture==='pinch'&&pointers.size>=2){
      const pts=[...pointers.values()].slice(0,2); const m=mid(pts), d=dist(pts);
      if(pinchPrev){
        ox+=m.x-pinchPrev.mid.x; oy+=m.y-pinchPrev.mid.y;
        const f=d/pinchPrev.dist, ix=(m.x-ox)/scale, iy=(m.y-oy)/scale;
        scale=clamp(scale*f,minScale,maxScale); ox=m.x-ix*scale; oy=m.y-iy*scale;
      }
      pinchPrev={mid:m,dist:d}; clampPan(); render();
    }else if(gesture==='pan'&&panLast){
      const c=toCanvas(e); ox+=c.x-panLast.x; oy+=c.y-panLast.y; panLast=c; clampPan(); render();
    }else if(gesture==='select'&&startImg){
      const p=canvasToImg(toCanvas(e));
      preview={rect:{x:Math.min(startImg.x,p.x),y:Math.min(startImg.y,p.y),w:Math.abs(p.x-startImg.x),h:Math.abs(p.y-startImg.y)}};
      render();

  // Encode the current image exactly as it will be saved. q: JPG quality 50..100.
  async function encodeOutput(fmt,q){

      html+=`（読込ファイル ${fmtSize(sourceBytes)} から ${pct>0?'+':pct<0?'−':'±'}${Math.abs(pct)}%）`;
    }
    sizeInfo.innerHTML=html;
  }
  let estTimer=0, estGen=0, tuning=false;
  function scheduleEstimate(){
    if(!hasImage||currentTab!=='convert'||tuning) return;
    clearTimeout(estTimer); estGen++;
    sizeInfo.textContent='出力サイズを計算中…';
    estTimer=setTimeout(async ()=>{
      const gen=estGen, blob=await getEncoded(outFormat,parseInt(quality.value,10));
      if(gen!==estGen) return;  // settings changed meanwhile
      if(blob) showSize(blob.size); else sizeInfo.textContent='出力サイズを計算できませんでした';
    },300);
  }

  // highest JPG quality (50..100) whose file fits the target; binary search, ~6 encodes
  targetBtn.addEventListener('click', async ()=>{
    if(!hasImage||tuning) return;
    const mb=parseFloat(targetMB.value);
    if(!(mb>0)){ sizeInfo.textContent='目標サイズを MB で入力してください（例: 10）'; targetMB.focus(); return; }
    const limit=mb*1e6;
    tuning=true; targetBtn.disabled=convertBtn.disabled=true; clearTimeout(estTimer); estGen++;
    try{
      let lo=50, hi=100, best=null, bestBlob=null, minBlob=null;
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        sizeInfo.textContent=`自動調整中… 画質 ${mid} を試しています`;
        const blob=await encodeOutput('jpg',mid);
        if(!blob){ sizeInfo.textContent='出力サイズを計算できませんでした'; return; }
        if(mid===50) minBlob=blob;
        if(blob.size<=limit){ best=mid; bestBlob=blob; lo=mid+1; } else hi=mid-1;
      }
      if(best===null){
        if(!minBlob) minBlob=await encodeOutput('jpg',50);
        sizeInfo.innerHTML=`画質 50 でも <b>${fmtSize(minBlob.size)}</b> になり、${fmtSize(limit)} 以下にできません。画像サイズを小さくしてください`;
        return;
      }
      quality.value=best; qualityVal.textContent=best;
      encCache={key:encKey('jpg',best),blob:bestBlob};
      showSize(bestBlob.size);
      sizeInfo.innerHTML+=` ／ ${fmtSize(limit)} 以下で最高の画質 <b>${best}</b> に設定しました`;
    }finally{ tuning=false; targetBtn.disabled=convertBtn.disabled=false; }
  });

  async function doConvert(){
    if(!hasImage||tuning) return;
    let blob, fname, mime;
    if(outFormat==='svg'){
      mime='image/svg+xml'; fname=`${sourceName}.svg`;
    }else{
      mime = outFormat==='jpg' ? 'image/jpeg' : 'image/png';
      fname=`${sourceName}.${outFormat==='jpg'?'jpg':'png'}`;
    }
    blob=await getEncoded(outFormat,parseInt(quality.value,10)); if(!blob) return;
    await deliverFile(blob,fname,mime);
  }

  /* ---------- upscale: accel detection ---------- */
  // Prefer the discrete GPU on multi-GPU PCs, then fall back to any adapter.
  async function requestGpuAdapter(){
    if(!navigator.gpu) return null;
    for(const powerPreference of ['high-performance',undefined,'low-power']){
      try{ const a=await navigator.gpu.requestAdapter(powerPreference?{powerPreference}:undefined); if(a) return a; }catch{}
    }
    return null;
  }
  async function detectAccel(){ return (await requestGpuAdapter()) ? 'webgpu' : 'cpu'; }

  /* ---------- model registry ---------- */
  // waifu2x swin_unet 4x models (nunif, MIT), exported to ONNX with nunif's exporter.
  // pad: edge padding the official web app uses per style. tile: per backend on desktop (the official
  // app recommends >= 256 for photo); mobile overrides it, see tileFor().
  const MODELS={
    photo:  { url:'models/waifu2x-photo/noise1_scale4x.onnx', key:'waifu2x-photo-noise1-4x', pad:'reflect',
              scale:4, offset:32, blend:16, tile:{ webgpu:256, wasm:256 } },
    illust: { url:'models/waifu2x-art/noise0_scale4x.onnx',   key:'waifu2x-art-noise0-4x',   pad:'replicate',
              scale:4, offset:32, blend:16, tile:{ webgpu:256, wasm:112 } }
  };
  let modelId='photo';
  const IS_MOBILE=/Android|iPhone|iPad|iPod/.test(navigator.userAgent)
    ||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);  // iPadOS reports as Mac
  // Output size limits. Mobile: iOS Safari's max canvas area (4096x4096); desktop: memory budget.
  const MAX_OUT_PIXELS=IS_MOBILE?4096*4096:8000*8000, MAX_OUT_SIDE=16384;
  try{ indexedDB.deleteDatabase('tensorflowjs'); }catch{}  // models of the removed TF.js engine

  // lightweight pixel buffer
  function makeImg(w,h,data){ return {width:w,height:h,data:data||new Uint8ClampedArray(w*h*4)}; }

  function applyResult(img){
    const fw=img.width, fh=img.height;
    base.width=fw; base.height=fh; comp.width=fw; comp.height=fh;
    bctx.putImageData(new ImageData(img.data,fw,fh),0,0);
    operations=[]; redoStack=[];
    buildComposite(); resize(); fitView(); updateEditState();

  /* ---------- waifu2x engine (ONNX Runtime Web) ---------- */
  const ORT_V='1.29.0', MODEL_CACHE='image-studio-models';
  const ortSessions={};  // key -> {session, ep}

  async function loadOrt(){
    if(window.ort) return true;
    try{ await loadScript(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_V}/dist/ort.min.js`); }catch{ return false; }
    // multi-threading only works when cross-origin isolated
    ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency||1) : 1;
    return true;
  }

  // ONNX models live in their own Cache Storage bucket, kept across app updates
  async function fetchModelBytes(url){
    let cache=null;
    try{ cache=await caches.open(MODEL_CACHE); const hit=await cache.match(url); if(hit) return new Uint8Array(await hit.arrayBuffer()); }catch{}
    progressText.textContent='モデルをダウンロード中…'; setFill(0);
    const res=await fetch(url);
    if(!res.ok) throw new Error(`model download failed (${res.status})`);
    const total=+res.headers.get('content-length')||0, chunks=[]; let got=0;
    const reader=res.body.getReader();
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      chunks.push(value); got+=value.length; if(total) setFill(Math.min(got/total,1));
    }
    const bytes=new Uint8Array(got); let o=0; for(const c of chunks){ bytes.set(c,o); o+=c.length; }
    try{ if(cache) await cache.put(url,new Response(bytes)); }catch{}
    return bytes;
  }

  function swinTileSize(t){ while((t-16)%12||(t-16)%16) t++; return t; }  // swin_unet tile constraint
  // Phones/tablets use 112px tiles: at 256 the model's intermediates reach ~84MB per tensor and
  // crashed iPhone Safari; 112 needs ~1/6 of that and gives visually identical output (no seams).
  const tileFor=(cfg,ep)=>swinTileSize(IS_MOBILE?112:cfg.tile[ep]);
  // Fixing the input size lets ORT fold the shape/mask subgraphs away at load time
  // (1702 -> 672 nodes); otherwise Mod/ConstantOfShape fall back to CPU on WebGPU every tile.
  function createSession(bytes, ep, tile){
    return ort.InferenceSession.create(bytes,{ executionProviders:[ep],
      freeDimensionOverrides:{ batch_size:1, input_height:tile, input_width:tile } });
  }
  async function getOrtSession(cfg, wasmReason){  // wasmReason: non-empty forces WASM
    const cached=ortSessions[cfg.key];
    if(cached&&!(wasmReason&&cached.ep!=='wasm')) return cached;
    const bytes=await fetchModelBytes(cfg.url);
    progressText.textContent='モデルを準備中…';
    let session=null, ep='wasm', gpuError=wasmReason||'';
    if(!wasmReason&&navigator.gpu){
      try{
        if(!ort.env.webgpu.adapter){
          const adapter=await requestGpuAdapter();
          if(!adapter) throw new Error('GPU adapter not found');
          ort.env.webgpu.adapter=adapter;
        }
        session=await createSession(bytes,'webgpu',tileFor(cfg,'webgpu')); ep='webgpu';
      }catch(e){ session=null; gpuError=String(e&&e.message||e); console.warn('waifu2x: WebGPU unavailable, using WASM:',e); }
    }
    if(!session){ session=await createSession(bytes,'wasm',tileFor(cfg,'wasm')); ep='wasm'; }
    return ortSessions[cfg.key]={session, ep, gpuError, tile:tileFor(cfg,ep)};
  }

  // Area-averaging (box filter) downscale of the 4x output to fw x fh, fed one finished 4x row
  // at a time in order, so the full 4x image never has to exist in memory.
  function makeDownsampler(OW,OH,fw,fh){
    const out=makeImg(fw,fh), od=out.data, rx=OW/fw, ry=OH/fh;
    const ts=[], tw=[], tn=new Int32Array(fw+1), tinv=new Float32Array(fw);  // horizontal taps per output x
    for(let x=0;x<fw;x++){
      tn[x]=ts.length; const a=x*rx, b=Math.min((x+1)*rx,OW); let sum=0;
      for(let sx=Math.floor(a);sx<b;sx++){ const w=Math.min(b,sx+1)-Math.max(a,sx); ts.push(sx); tw.push(w); sum+=w; }
      tinv[x]=1/sum;
    }
    tn[fw]=ts.length;
    const TS=Int32Array.from(ts), TW=Float32Array.from(tw), hrow=new Float32Array(fw*3);
    const pend=new Map();  // output row -> {buf, w}: vertical accumulation
    const put=(y,w)=>{
      if(y>=fh||w<=0) return;
      let r=pend.get(y); if(!r){ r={buf:new Float32Array(fw*3),w:0}; pend.set(y,r); }
      const b=r.buf; for(let i=0;i<b.length;i++) b[i]+=hrow[i]*w; r.w+=w;
    };
    const flush=y=>{
      const r=pend.get(y); if(!r) return; pend.delete(y);
      const b=r.buf, k=255/r.w;  // Uint8ClampedArray stores with round-to-nearest
      for(let x=0,o=y*fw*4;x<fw;x++,o+=4){ od[o]=b[x*3]*k; od[o+1]=b[x*3+1]*k; od[o+2]=b[x*3+2]*k; od[o+3]=255; }
    };
    return {
      out,
      row(gy,rgb){  // rgb: OW*3 floats in 0..1 for 4x row gy
        for(let x=0;x<fw;x++){
          let r=0,g=0,bl=0;
          for(let t=tn[x];t<tn[x+1];t++){ const si=TS[t]*3, w=TW[t]; r+=rgb[si]*w; g+=rgb[si+1]*w; bl+=rgb[si+2]*w; }
          const k=tinv[x]; hrow[x*3]=r*k; hrow[x*3+1]=g*k; hrow[x*3+2]=bl*k;
        }
        const y0=Math.floor(gy/ry), e0=(y0+1)*ry;
        put(y0,Math.min(gy+1,e0)-Math.max(gy,y0*ry));
        if(gy+1>e0) put(y0+1,gy+1-e0);
        for(const y of [...pend.keys()]) if((y+1)*ry<=gy+1+1e-6) flush(y);
      },
      finish(){ for(const y of [...pend.keys()]) flush(y); }
    };
  }

  // waifu2x tiled rendering with seam blending (port of nunif/utils/seam_blending.py).
  // Output rows are finalized one tile row at a time, so the float buffers only span one tile row.
  async function enlargeWaifu2x(src, sess, cfg, fw, fh){
    const {scale, offset, blend}=cfg, W=src.width, H=src.height, OW=W*scale, OH=H*scale;
    const tile=sess.tile;
    const inOff=Math.ceil(offset/scale), inStep=tile-(inOff*2+Math.ceil(blend/scale));
    const T=tile*scale-offset*2, outStep=inStep*scale;   // model output size / output tile step
    let hb=0, wb=0, ih=0, iw=0;
    while(ih<H+inOff*2){ ih=hb*inStep+tile; hb++; }
    while(iw<W+inOff*2){ iw=wb*inStep+tile; wb++; }
    const BW=iw*scale;
    // blend filter: (d+1)/(blend+1) within `blend` px of the edge, 1 inside
    const filt=new Float32Array(T*T);
    for(let y=0;y<T;y++) for(let x=0;x<T;x++){
      const d=Math.min(x,y,T-1-x,T-1-y); filt[y*T+x]= d<blend ? (d+1)/(blend+1) : 1;
    }
    const plane=T*BW, acc=new Float32Array(plane*3), wsum=new Float32Array(plane);
    const ds=makeDownsampler(OW,OH,fw,fh), rgb=new Float32Array(OW*3);
    const tin=new Float32Array(3*tile*tile), tt=tile*tile, sd=src.data;
    const edge=cfg.pad==='reflect'
      ? (i,n)=>{ if(n===1) return 0; const p=2*(n-1); i=((i%p)+p)%p; return i<n?i:p-i; }
      : (i,n)=>Math.min(Math.max(i,0),n-1);
    const total=hb*wb; let done=0;
    for(let hi=0;hi<hb;hi++){
      for(let wi=0;wi<wb;wi++){
        // input tile with edge padding: RGBA -> CHW float
        const iy=hi*inStep-inOff, ix=wi*inStep-inOff;
        for(let y=0;y<tile;y++){
          const sy=edge(iy+y,H);
          for(let x=0;x<tile;x++){
            const sx=edge(ix+x,W), si=(sy*W+sx)*4, ti=y*tile+x;
            tin[ti]=sd[si]/255; tin[tt+ti]=sd[si+1]/255; tin[2*tt+ti]=sd[si+2]/255;
          }
        }
        const res=await sess.session.run({x:new ort.Tensor('float32',tin,[1,3,tile,tile])});
        const yv=res.y.data, TT=T*T, x0=wi*outStep;
        for(let y=0;y<T;y++){
          const row=y*BW+x0, frow=y*T;
          for(let x=0;x<T;x++){
            const w=filt[frow+x], bi=row+x, ti=frow+x;
            wsum[bi]+=w; acc[bi]+=w*yv[ti]; acc[plane+bi]+=w*yv[TT+ti]; acc[2*plane+bi]+=w*yv[2*TT+ti];
          }
        }
        res.y.dispose&&res.y.dispose();
        done++; setFill(done/total); progressText.textContent=`処理中… ${Math.round(done/total*100)}%`;
        await new Promise(r=>setTimeout(r));
      }
      // hand the rows this tile row finalized to the downsampler, then shift the overlap to the top
      const last=hi===hb-1, rows=last?T:outStep, base=hi*outStep;
      for(let r=0;r<rows;r++){
        const gy=base+r; if(gy>=OH) break;
        for(let gx=0;gx<OW;gx++){
          const bi=r*BW+gx, inv=1/wsum[bi], j=gx*3;
          rgb[j]=Math.min(Math.max(acc[bi]*inv,0),1); rgb[j+1]=Math.min(Math.max(acc[plane+bi]*inv,0),1); rgb[j+2]=Math.min(Math.max(acc[2*plane+bi]*inv,0),1);
        }
        ds.row(gy,rgb);
      }
      if(!last){
        const keep=(T-outStep)*BW;
        for(let c=0;c<3;c++){ const p0=c*plane; acc.copyWithin(p0,p0+outStep*BW,p0+plane); acc.fill(0,p0+keep,p0+plane); }
        wsum.copyWithin(0,outStep*BW,plane); wsum.fill(0,keep,plane);
      }
    }
    ds.finish();
    return ds.out;
  }

  async function upscaleWaifu2x(input, cfg, fw, fh){
    let sess=await getOrtSession(cfg,'');
    // when WebGPU was unusable, show why (shortened) so it can be reported
    const label=s=>`バックエンド: ${s.ep==='webgpu'?'WebGPU':'CPU (WASM)'} ／ ${upscaleFactor}×`
      +(s.ep!=='webgpu'&&s.gpuError?` ／ WebGPU不可: ${s.gpuError.slice(0,60)}`:'');
    progressText.textContent='処理中… 0%'; progressSub.textContent=label(sess); setFill(0);
    try{ return await enlargeWaifu2x(input, sess, cfg, fw, fh); }
    catch(err){
      if(sess.ep!=='webgpu') throw err;
      // WebGPU failed: retry on WASM
      console.warn('waifu2x: WebGPU run failed, retrying on WASM:',err);
      sess=await getOrtSession(cfg,String(err&&err.message||err));
      progressText.textContent='処理中… 0%'; progressSub.textContent=label(sess); setFill(0);
      return await enlargeWaifu2x(input, sess, cfg, fw, fh);
    }
  }

  /* ---------- upscale button ---------- */
  let upscaling=false;
  upscaleBtn.addEventListener('click', async ()=>{
    if(!hasImage||upscaling) return;
    const w0=comp.width, h0=comp.height, fw=Math.round(w0*upscaleFactor), fh=Math.round(h0*upscaleFactor);
    if(fw*fh>MAX_OUT_PIXELS||Math.max(fw,fh)>MAX_OUT_SIDE){
      showProgress('画像が大きすぎます',`出力の上限は約${Math.round(MAX_OUT_PIXELS/1e6)}MPです（現在 ${upscaleFactor}× で ${fw}×${fh}）。小さい倍率か画像でお試しください`);

    showProgress('AIエンジンを準備中…','ONNX Runtime を読み込んでいます');

      if(!await loadOrt()){ progressText.textContent='エンジンの読み込みに失敗'; progressSub.textContent='オンライン環境でお試しください'; setTimeout(hideProgress,2800); return; }
      const src=cctx.getImageData(0,0,w0,h0);

      progressText.textContent='処理に失敗しました'; progressSub.textContent=String(err&&err.message||err).slice(0,120);
      setTimeout(hideProgress,3200);

  });

  /* ---------- PDF: open, write text, save (pdf.js renders, pdf-lib saves) ---------- */
  const PDFJS_V='6.4.299', PDFLIB_V='1.17.1';
  const PDFJS_ROOT=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/`, PDFJS_BUILD=PDFJS_ROOT+'legacy/build/';
  const PDF_TEXT_DPI=600;  // resolution of the text images placed into the saved PDF
  let pdfjsLib=null;
  async function loadPdfJs(){
    if(pdfjsLib) return pdfjsLib;
    const lib=await import(PDFJS_BUILD+'pdf.min.mjs');
    // a cross-origin module worker can't be started directly; start a same-origin one that imports it
    try{
      const src=URL.createObjectURL(new Blob([`import "${PDFJS_BUILD}pdf.worker.min.mjs";`],{type:'text/javascript'}));
      lib.GlobalWorkerOptions.workerPort=new Worker(src,{type:'module'});
    }catch{ lib.GlobalWorkerOptions.workerSrc=PDFJS_BUILD+'pdf.worker.min.mjs'; }  // pdf.js falls back to its main-thread worker
    return pdfjsLib=lib;
  }

  async function loadPdf(file){
    showProgress('PDF を読み込み中…','');
    try{
      const lib=await loadPdfJs();
      const bytes=new Uint8Array(await file.arrayBuffer());
      // pdf.js transfers the buffer it gets to its worker, so give it a copy and keep the original for saving
      const doc=await lib.getDocument({data:bytes.slice(), cMapUrl:PDFJS_ROOT+'cmaps/', cMapPacked:true,
        standardFontDataUrl:PDFJS_ROOT+'standard_fonts/', wasmUrl:PDFJS_ROOT+'wasm/', iccUrl:PDFJS_ROOT+'iccs/'}).promise;
      closePdf();
      pdfDoc={doc, bytes, cur:0, pages:Array.from({length:doc.numPages},()=>({ops:[],redo:[],vp:null,rs:1}))};
      sourceName=(file.name||'document').replace(/\.[^.]+$/,''); sourceBytes=file.size||0;
      hasImage=true; canvas.classList.add('loaded'); drop.classList.add('hide');
      saveBtn.disabled=false; replaceBtn.disabled=false;
      setTab('pdf');
      await showPdfPage(0);
      hideProgress();
    }catch(err){
      progressText.textContent='PDF を開けませんでした';
      progressSub.textContent= err&&err.name==='PasswordException' ? 'パスワード付きの PDF には対応していません' : String(err&&err.message||err).slice(0,120);
      setTimeout(hideProgress,3600);
    }
  }
  function closePdf(){
    if(!pdfDoc) return;
    try{ pdfDoc.doc.destroy(); }catch{}
    pdfDoc=null; selItemIdx=-1; itemDrag=null; pdfText.value='';
  }
  // store the shown page's edits (operations/redoStack are the live arrays of the page on screen)
  function syncPageState(){ const pg=pdfDoc&&pdfDoc.pages[pdfDoc.cur]; if(pg&&pg.vp){ pg.ops=operations; pg.redo=redoStack; } }

  async function showPdfPage(i){
    syncPageState();
    const pg=pdfDoc.pages[i], page=await pdfDoc.doc.getPage(i+1);
    const v1=page.getViewport({scale:1});
    const rs=Math.min(4,(IS_MOBILE?1800:2400)/Math.max(v1.width,v1.height));  // render px per PDF point
    const vp=page.getViewport({scale:rs});
    base.width=comp.width=Math.round(vp.width); base.height=comp.height=Math.round(vp.height);
    bctx.setTransform(1,0,0,1,0,0); bctx.fillStyle='#fff'; bctx.fillRect(0,0,base.width,base.height);
    await page.render({canvas:base, viewport:vp}).promise;
    pg.vp=vp; pg.rs=rs;
    pdfDoc.cur=i; operations=pg.ops; redoStack=pg.redo; selItemIdx=-1; pdfText.value='';
    pdfPageLabel.textContent=`${i+1} / ${pdfDoc.pages.length}`;
    pdfPrev.disabled=i===0; pdfNext.disabled=i===pdfDoc.pages.length-1;
    resize(); buildComposite(); fitView(); refreshUI();
  }
  async function gotoPage(i){
    if(!pdfDoc||i<0||i>=pdfDoc.pages.length||i===pdfDoc.cur) return;
    deselectItem(); showProgress('ページを表示中…','');
    try{ await showPdfPage(i); }finally{ hideProgress(); }
  }
  pdfPrev.addEventListener('click',()=>pdfDoc&&gotoPage(pdfDoc.cur-1));
  pdfNext.addEventListener('click',()=>pdfDoc&&gotoPage(pdfDoc.cur+1));
  pdfOpenBtn.addEventListener('click',openPicker);

  // text/stamp tools: tap an item to select it (drag to move); tap elsewhere to finish the selection,
  // or to place the typed text / chosen stamp. Pen tool: a one-finger drag draws.
  function hitItem(p,type){
    const tol=6*dpr/scale;
    for(let i=operations.length-1;i>=0;i--){
      const op=operations[i]; if(op.type!==type) continue;
      const b=itemBox(op);
      if(p.x>=b.x-tol&&p.x<=b.x+b.w+tol&&p.y>=b.y-tol&&p.y<=b.y+b.h+tol) return i;
    }
    return -1;
  }
  function pdfPointerDown(c){
    const p=canvasToImg(c);
    if(pdfTool==='pen'){ penPts=[p]; gesture='pen'; render(); return true; }
    const hit=hitItem(p,pdfTool);
    if(hit>=0){ selectItem(hit); gesture='item-move'; itemDrag={p0:p,x:operations[hit].x,y:operations[hit].y}; render(); return true; }
    if(selItemIdx>=0){ deselectItem(); render(); return true; }
    let op;
    if(pdfTool==='stamp'){
      if(!curStamp){ showProgress('印鑑が登録されていません','「＋ 登録」から印鑑の画像を登録してください'); setTimeout(hideProgress,2200); return true; }
      op={type:'stamp',stamp:curStamp,mm:parseFloat(stampSize.value),x:0,y:0};
      const b=itemBox(op); op.x=p.x-b.w/2; op.y=p.y-b.h/2;  // centred on the tap
    }else{
      const t=pdfText.value; if(!t.trim()) return false;  // nothing to place: let the drag pan
      op={type:'text',text:t,x:p.x,y:0,pt:parseFloat(pdfSize.value),font:pdfFont,color:pdfColor};
      op.y=p.y-itemBox(op).h/2;  // vertically centred on the tap
    }
    operations.push(op); redoStack.length=0;
    selectItem(operations.length-1); buildComposite(); render();
    return true;
  }
  function setSegOn(seg,attr,val){ seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===val)); }
  function selectItem(i){
    selItemIdx=i; const op=operations[i];
    if(op.type==='stamp'){
      stampSize.value=op.mm; stampSizeVal.textContent=op.mm+'mm'; curStamp=op.stamp; renderStampList();
    }else{
      pdfText.value=op.text; pdfSize.value=op.pt; pdfSizeVal.textContent=op.pt;
      pdfFont=op.font; pdfColor=op.color; setSegOn(pdfFontSeg,'font',op.font); setSegOn(pdfColorSeg,'color',op.color);
    }
    updateEditState();
  }
  function deselectItem(){
    const op=selItemIdx>=0&&operations[selItemIdx];
    if(op&&op.type==='text'&&!op.text.trim()) operations.splice(selItemIdx,1);  // drop emptied texts
    selItemIdx=-1; itemDrag=null; pdfText.value='';
    if(pdfDoc){ buildComposite(); updateEditState(); }
  }
  function deleteSelectedItem(){
    if(selItemIdx<0) return;
    operations.splice(selItemIdx,1); selItemIdx=-1; pdfText.value='';
    buildComposite(); render(); updateEditState();
  }
  const editSelected=fn=>{ if(selItemIdx>=0&&operations[selItemIdx]){ fn(operations[selItemIdx]); buildComposite(); render(); } };
  // Japanese IME: the field holds unconverted text while composing, and the Enter that confirms a
  // conversion must not be taken as "done" (clearing the field mid-conversion made the IME re-insert it)
  let composing=false;
  pdfText.addEventListener('compositionstart',()=>composing=true);
  const editText=fn=>editSelected(op=>{ if(op.type==='text') fn(op); });
  pdfText.addEventListener('compositionend',()=>{ composing=false; editText(op=>op.text=pdfText.value); });
  pdfText.addEventListener('input',()=>editText(op=>op.text=pdfText.value));
  pdfText.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||composing||e.isComposing||e.keyCode===229) return;
    e.preventDefault(); pdfText.blur(); if(selItemIdx>=0){ deselectItem(); render(); }
  });
  pdfSize.addEventListener('input',()=>{ pdfSizeVal.textContent=pdfSize.value; editText(op=>op.pt=parseFloat(pdfSize.value)); });
  pdfFontSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ pdfFont=b.dataset.font; setSegOn(pdfFontSeg,'font',pdfFont); editText(op=>op.font=pdfFont); }));
  pdfColorSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ pdfColor=b.dataset.color; setSegOn(pdfColorSeg,'color',pdfColor); editText(op=>op.color=pdfColor); }));
  stampSize.addEventListener('input',()=>{
    stampSizeVal.textContent=stampSize.value+'mm';
    editSelected(op=>{ if(op.type!=='stamp') return;  // resize around the stamp's centre
      const a=itemBox(op); op.mm=parseFloat(stampSize.value); const n=itemBox(op);
      op.x=a.x+(a.w-n.w)/2; op.y=a.y+(a.h-n.h)/2; });
  });
  penWidth.addEventListener('input',()=>penWidthVal.textContent=penWidth.value);
  pdfToolSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    pdfTool=b.dataset.tool; setSegOn(pdfToolSeg,'tool',pdfTool);
    if(selItemIdx>=0) deselectItem();
    refreshUI(); render();
  }));

  // my stamps (印鑑): registered images, kept on this device only (IndexedDB), never uploaded
  function blobToImage(blob){
    return new Promise((res,rej)=>{ const url=URL.createObjectURL(blob), im=new Image();
      im.onload=()=>res({img:im,url}); im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); }; im.src=url; });
  }
  async function stampFromRecord(r){ const {img,url}=await blobToImage(new Blob([r.png],{type:'image/png'})); return {...r,img,url}; }
  const saveStamps=()=>idbSet('my-stamps',myStamps.map(({id,png,w,h})=>({id,png,w,h})));
  // Downscale, optionally turn the paper white transparent (and undo the white blend on ink edges),
  // then trim to the ink.
  async function makeStampPng(file,removeWhite){
    const {img:src,url}=await blobToImage(file); URL.revokeObjectURL(url);
    const f=Math.min(1,800/Math.max(src.naturalWidth,src.naturalHeight));
    const w=Math.max(1,Math.round(src.naturalWidth*f)), h=Math.max(1,Math.round(src.naturalHeight*f));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cx=c.getContext('2d'); cx.drawImage(src,0,0,w,h);
    const id=cx.getImageData(0,0,w,h), d=id.data;
    let x0=w,y0=h,x1=-1,y1=-1;
    for(let i=0,px=0;i<d.length;i+=4,px++){
      let a=d[i+3]/255;
      if(removeWhite){
        const k=Math.min(1,Math.max(0,(255-Math.min(d[i],d[i+1],d[i+2])-45)/70));  // paper -> 0, ink -> 1
        if(k>0) for(let j=0;j<3;j++) d[i+j]=(d[i+j]-255*(1-k))/k;
        a*=k;
      }
      d[i+3]=a*255;
      if(d[i+3]>12){ const X=px%w, Y=(px-X)/w; if(X<x0)x0=X; if(X>x1)x1=X; if(Y<y0)y0=Y; if(Y>y1)y1=Y; }
    }
    if(x1<0) throw new Error('印鑑の部分が見つかりませんでした');
    cx.putImageData(id,0,0);
    x0=Math.max(0,x0-2); y0=Math.max(0,y0-2); x1=Math.min(w-1,x1+2); y1=Math.min(h-1,y1+2);
    const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1;
    o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    const png=await new Promise(r=>o.toBlob(r,'image/png'));
    return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), png:await png.arrayBuffer(), w:o.width, h:o.height};
  }
  function renderStampList(){
    stampList.innerHTML='';
    if(!myStamps.length){ const n=document.createElement('span'); n.className='none'; n.textContent='未登録'; stampList.appendChild(n); return; }
    myStamps.forEach(st=>{
      const b=document.createElement('div'); b.className='stamp-item'+(st===curStamp?' on':''); b.title='この印鑑を使う';
      const im=document.createElement('img'); im.src=st.url; im.alt='印鑑'; b.appendChild(im);
      const x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='×'; x.title='登録を削除';
      x.addEventListener('click',e=>{ e.stopPropagation(); if(!confirm('この印鑑の登録を削除しますか？（ページに押した印鑑は残ります）')) return;
        myStamps=myStamps.filter(s=>s!==st); if(curStamp===st) curStamp=myStamps[0]||null; saveStamps(); renderStampList(); });
      b.appendChild(x);
      b.addEventListener('click',()=>{ curStamp=st; renderStampList(); });
      stampList.appendChild(b);
    });
  }
  stampAddBtn.addEventListener('click',()=>{ stampInput.value=''; stampInput.click(); });
  stampInput.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const st=await stampFromRecord(await makeStampPng(file,stampWhite.checked));
      myStamps.push(st); curStamp=st; saveStamps(); renderStampList();
    }catch(err){ showProgress('印鑑を登録できませんでした',String(err&&err.message||err).slice(0,120)); setTimeout(hideProgress,2800); }
  });
  idbGet('my-stamps').then(async v=>{
    if(Array.isArray(v)) for(const r of v){ try{ myStamps.push(await stampFromRecord(r)); }catch{} }
    curStamp=myStamps[0]||null; renderStampList();
  });
  pdfDelBtn.addEventListener('click',deleteSelectedItem);
  pdfUndoBtn.addEventListener('click',()=>{ selItemIdx=-1; itemDrag=null; pdfText.value=''; undo(); });
  pdfSaveBtn.addEventListener('click',savePdf);

  // Keep the original PDF untouched and place each text, stamp and run of pen strokes on top as a
  // transparent image, positioned through the page viewport (so crop boxes and page rotation map correctly).
  function placeImage(page,img,vp,x0,y0,x1,y1){  // box in page-view px
    const {degrees}=window.PDFLib;
    const [blx,bly]=vp.convertToPdfPoint(x0,y1), [brx,bry]=vp.convertToPdfPoint(x1,y1), [tlx,tly]=vp.convertToPdfPoint(x0,y0);
    page.drawImage(img,{x:blx,y:bly,width:Math.hypot(brx-blx,bry-bly),height:Math.hypot(tlx-blx,tly-bly),
      rotate:degrees(Math.atan2(bry-bly,brx-blx)*180/Math.PI)});
  }
  const canvasPng=async c=>new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/png'))).arrayBuffer());
  // consecutive pen strokes -> one image of their bounding box at PDF_TEXT_DPI (capped at 16MP)
  async function penLayer(out,page,pg,pens){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const op of pens){ const r=op.w*pg.rs/2+2; for(const q of op.pts){ x0=Math.min(x0,q.x-r); y0=Math.min(y0,q.y-r); x1=Math.max(x1,q.x+r); y1=Math.max(y1,q.y+r); } }
    let k=PDF_TEXT_DPI/72; const wPt=(x1-x0)/pg.rs, hPt=(y1-y0)/pg.rs;
    k=Math.min(k,Math.sqrt(16e6/Math.max(1,wPt*hPt)));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(wPt*k)); c.height=Math.max(1,Math.ceil(hPt*k));
    const cx=c.getContext('2d'), s=k/pg.rs;
    for(const op of pens) strokePen(cx,op.pts,op.w*k,op.color,x0,y0,s);
    placeImage(page,await out.embedPng(await canvasPng(c)),pg.vp,x0,y0,x0+c.width/s,y0+c.height/s);
  }
  async function savePdf(){
    if(!pdfDoc) return;
    deselectItem(); render(); syncPageState();
    showProgress('PDF を作成中…','');
    try{
      if(!window.PDFLib) await loadScript(`https://cdn.jsdelivr.net/npm/pdf-lib@${PDFLIB_V}/dist/pdf-lib.min.js`);
      const out=await window.PDFLib.PDFDocument.load(pdfDoc.bytes,{updateMetadata:false});
      const pages=out.getPages(), k=PDF_TEXT_DPI/72, stampImgs=new Map();
      for(let i=0;i<pdfDoc.pages.length;i++){
        const pg=pdfDoc.pages[i]; let pens=[];
        for(const op of pg.ops.concat([null])){  // null flushes the last run of pen strokes
          if(op&&op.type==='pen'){ pens.push(op); continue; }
          if(pens.length){ await penLayer(out,pages[i],pg,pens); pens=[]; }  // keeps the on-screen stacking order
          if(!op) break;
          if(op.type==='stamp'){
            let img=stampImgs.get(op.stamp);
            if(!img){ img=await out.embedPng(new Uint8Array(op.stamp.png)); stampImgs.set(op.stamp,img); }
            const b=itemBox(op,pg.rs); placeImage(pages[i],img,pg.vp,b.x,b.y,b.x+b.w,b.y+b.h);
          }else if(op.type==='text'&&op.text.trim()){
            const c=document.createElement('canvas'), cx=c.getContext('2d');
            const px=op.pt*k, t=textMetrics(cx,op,px), pad=Math.ceil(px*0.1);
            c.width=Math.ceil(t.w)+pad*2; c.height=Math.ceil(t.asc+t.desc)+pad*2;
            drawText(cx,op,px,pad,pad);
            const s=pg.rs/k, x0=op.x-pad*s, y0=op.y-pad*s;
            placeImage(pages[i],await out.embedPng(await canvasPng(c)),pg.vp,x0,y0,x0+c.width*s,y0+c.height*s);
          }
        }
      }
      const bytes=await out.save();
      hideProgress();
      await deliverFile(new Blob([bytes],{type:'application/pdf'}),`${sourceName}_edited.pdf`,'application/pdf');
    }catch(err){
      progressText.textContent='PDF の保存に失敗しました'; progressSub.textContent=String(err&&err.message||err).slice(0,120);
      setTimeout(hideProgress,3600);
    }
  }

  /* ---------- resize ---------- */
  function resize(){
    dpr=window.devicePixelRatio||1;
    const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return;
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    if(hasImage){ clampPan(); render(); }
  }
  new ResizeObserver(()=>resize()).observe(stage);
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));

  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
  syncStrengthLabel(); syncToolUI(); resize(); refreshUI();
})();
</script>
</body>
