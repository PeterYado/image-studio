<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mosaic Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5FA;
    --surface: #FFFFFF;
    --canvas-bg: #211B29;
    --ink: #1A1320;
    --ink-soft: #6B6478;
    --line: #E7E2EE;
    --accent: #6B3FA0;        /* 노기자카 퍼플 (단색 악센트) */
    --accent-deep: #4A2873;
    --accent-wash: #F0EBF7;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(26,19,32,.04), 0 8px 24px rgba(74,40,115,.06);
    --font: "Zen Kaku Gothic New", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    flex: none;
    padding: max(14px, env(safe-area-inset-top)) 20px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    position: relative;
    flex: none;
  }
  .brand-mark::before {
    content: "";
    position: absolute; inset: 6px 6px auto auto;
    width: 8px; height: 8px;
    background: var(--bg);
    border-radius: 2px;
    box-shadow: -10px 0 0 var(--bg), 0 10px 0 var(--bg), -10px 10px 0 rgba(247,245,250,.55);
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: .04em;
  }
  .brand h1 span { color: var(--accent); }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--line);
    width: fit-content;
  }
  .tab {
    appearance: none; border: none; cursor: pointer;
    font-family: var(--font);
    font-size: 14px; font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    padding: 9px 22px;
    border-radius: 9px;
    transition: color .18s, background .18s;
    letter-spacing: .02em;
  }
  .tab.active {
    color: #fff;
    background: var(--accent);
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    min-height: 0;
    padding: 16px 20px;
    display: flex;
  }
  .stage {
    flex: 1;
    border-radius: var(--radius);
    background: var(--canvas-bg);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  /* subtle checker so transparency / framing reads */
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.025) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,.025) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.025) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    pointer-events: none;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    display: none;
    position: relative;
    z-index: 1;
    border-radius: 4px;
  }
  canvas.loaded { display: block; }

  /* ---------- Empty / dropzone ---------- */
  .drop {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    padding: 32px;
    text-align: center;
    z-index: 2;
    transition: background .18s;
  }
  .drop.hide { display: none; }
  .drop.over { background: rgba(107,63,160,.16); }
  .drop-ico {
    width: 56px; height: 56px;
    border-radius: 16px;
    border: 1.5px dashed rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .drop-ico svg { width: 26px; height: 26px; stroke: rgba(255,255,255,.7); }
  .drop p { color: rgba(255,255,255,.78); font-size: 14px; font-weight: 500; line-height: 1.5; }
  .drop p b { color: #fff; font-weight: 700; }
  .drop .pick {
    margin-top: 4px;
    appearance: none; border: none; cursor: pointer;
    font-family: var(--font); font-weight: 700; font-size: 14px;
    color: var(--accent-deep); background: #fff;
    padding: 11px 24px; border-radius: 10px;
    transition: transform .12s;
  }
  .drop .pick:active { transform: scale(.96); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    flex: none;
    padding: 0 20px max(18px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .tool-hint {
    flex: 1;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-hint b { color: var(--accent-deep); }
  .btn {
    appearance: none; cursor: pointer;
    font-family: var(--font); font-weight: 700; font-size: 14px;
    padding: 11px 20px; border-radius: 11px;
    transition: transform .12s, opacity .18s, background .18s;
    display: inline-flex; align-items: center; gap: 7px;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn svg { width: 16px; height: 16px; }
  .btn-ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; }

  /* WIP marker for tabs not yet built */
  .wip {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 3;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: rgba(255,255,255,.6);
    background: rgba(0,0,0,.25);
    padding: 6px 14px; border-radius: 99px;
    backdrop-filter: blur(6px);
    display: none;
  }
  .wip.show { display: block; }

  @media (max-width: 460px) {
    .brand h1 { font-size: 16px; }
    .tab { padding: 9px 0; flex: 1; text-align: center; }
    .tabs { width: 100%; }
    .btn { padding: 11px 16px; }
    .tool-hint { display: none; }
    .toolbar { gap: 8px; }
    .toolbar .btn { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>MOSAIC <span>STUDIO</span></h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="mosaic" role="tab">モザイク</button>
      <button class="tab" data-tab="upscale" role="tab">画質アップ</button>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="wip" id="wip">この機能は次のステップで実装予定</div>
      <canvas id="canvas"></canvas>
      <div class="drop" id="drop">
        <div class="drop-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <p>写真を<b>ドラッグ＆ドロップ</b><br>または下のボタンから選択</p>
        <button class="pick" id="pickEmpty">写真を選ぶ</button>
      </div>
    </div>
  </main>

  <div class="toolbar">
    <div class="tool-hint" id="hint">写真を読み込んでください</div>
    <button class="btn btn-ghost" id="replaceBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      別の写真
    </button>
    <button class="btn btn-primary" id="saveBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      保存
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
  "use strict";

  const stage     = document.getElementById('stage');
  const canvas    = document.getElementById('canvas');
  const ctx       = canvas.getContext('2d');
  const drop      = document.getElementById('drop');
  const wip       = document.getElementById('wip');
  const hint      = document.getElementById('hint');
  const fileInput = document.getElementById('fileInput');
  const saveBtn   = document.getElementById('saveBtn');
  const replaceBtn= document.getElementById('replaceBtn');
  const pickEmpty = document.getElementById('pickEmpty');
  const tabs      = document.querySelectorAll('.tab');

  let currentTab = 'mosaic';
  let hasImage = false;
  let sourceName = 'image';

  /* ---------- Tabs ---------- */
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      refreshUI();
    });
  });

  function refreshUI() {
    // M1: 両タブとも「読み込み / 保存」のみ実装。各タブ固有の道具は次ステップ。
    wip.classList.toggle('show', hasImage);
    if (!hasImage) {
      hint.textContent = '写真を読み込んでください';
    } else if (currentTab === 'mosaic') {
      hint.innerHTML = '<b>モザイク</b>：範囲指定とぼかしは M2 以降で追加';
    } else {
      hint.innerHTML = '<b>画質アップ</b>：AI 超解像は M5 で追加';
    }
  }

  /* ---------- Load image ---------- */
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    sourceName = (file.name || 'image').replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      hasImage = true;
      canvas.classList.add('loaded');
      drop.classList.add('hide');
      saveBtn.disabled = false;
      replaceBtn.disabled = false;
      refreshUI();
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert('画像の読み込みに失敗しました'); };
    img.src = url;
  }

  /* ---------- File picker ---------- */
  function openPicker() { fileInput.value = ''; fileInput.click(); }
  pickEmpty.addEventListener('click', openPicker);
  replaceBtn.addEventListener('click', openPicker);
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  /* ---------- Drag & drop (desktop) ---------- */
  ['dragenter','dragover'].forEach(ev =>
    stage.addEventListener(ev, e => { e.preventDefault(); if (!hasImage) drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev =>
    stage.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  stage.addEventListener('drop', e => {
    const file = e.dataTransfer && e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
  // paste from clipboard
  window.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });

  /* ---------- Save ---------- */
  saveBtn.addEventListener('click', () => {
    canvas.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${sourceName}_edited.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  /* ---------- PWA service worker (ignored silently if unavailable) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  refreshUI();
})();
</script>
</body>
</html>
